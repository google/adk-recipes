[project]
name = "finops-zero-trust-governor"
version = "0.1.0"
description = "Multi-agent Cloud FinOps governor with BigQuery telemetry triage and mid-task OAuth revocation guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.156.0,<2.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Use public PyPI as the default index for this recipe.
[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--ignore=tests/integration"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

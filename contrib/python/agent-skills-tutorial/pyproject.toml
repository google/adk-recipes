[project]
name = "agent-skills-tutorial"
version = "0.1.0"
description = "ADK agent demonstrating 4 skill patterns: inline skills, file-based skills, external skills, and meta skills (skill-creator). Uses SkillToolset for progressive disclosure."
authors = [{ name = "Lavi Nigam", email = "nicklavi@google.com" }]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "google-adk[gcp,otel-gcp]<3.0.0,>=2.6.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "google-cloud-aiplatform[agent-engines]>=1.156.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.26.0",
    "pytest>=8.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

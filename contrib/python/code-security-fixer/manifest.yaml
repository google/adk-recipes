# ADK Recipe Manifest — manifest.yaml
# Fields marked REQUIRED must be present. All others are optional.
# ============================================================

# REQUIRED — Recipe type.
#   standalone : complete, runnable recipe with its own entry point
#   module     : importable sub-agent meant to be orchestrated by another workflow
type: "standalone"

# OPTIONAL — Set to true only if the recipe can be fully deployed with a single command and no manual configuration steps (e.g. has Terraform config or a deploy script).
deployable: true

# REQUIRED — Maintenance status.
#   active | inactive
status: "active"

# REQUIRED — Primary programming language.
#   python | java | go | kotlin | typescript
language: "python"

# REQUIRED — Short description of what this recipe does and the value it provides.
description: "Fixes real security vulnerabilities with an ADK 2.0 graph workflow: a single-turn Gemini node proposes patches and a deterministic validator (Bandit plus the project's own functional and exploit tests, run in a resource-limited subprocess on a throwaway copy) keeps only patches that fix something and break nothing. Anchored on Django's archive.extract() path traversal (CVE-2021-3281 and its incomplete-fix follow-up CVE-2025-59682), with the agent's fix compared to both historical patches. Outputs a unified diff for human review; never commits. Serves A2A over JSON-RPC and HTTP+JSON for Gemini Enterprise and the Gemini agent."

# OPTIONAL — Agent architecture details. Omit the whole block if unknown.
architecture:
  agent: "single"
  stateful: true
  datasources:
    - "local"

# OPTIONAL — Library and service dependencies.
dependencies:
  libraries:
    - "ADK"
    - "Bandit"
  services:
    - "Gemini"

# REQUIRED — Ownership. Both sub-fields are required.
ownership:
  team: "Cloud AI"
  poc: "debanshd"
  # OPTIONAL — Additional contributors other than the poc.
  # contributors:
  #   - "github-id"

# OPTIONAL — Classification tags (technology names, patterns, use-case keywords).
tags:
  - "security"
  - "appsec"
  - "vulnerability-remediation"
  - "code-repair"
  - "bandit"
  - "verifier"
  - "adk-2.0"
  - "graph-workflow"
  - "a2a"
  - "gemini-enterprise"
  - "django"
  - "cve"
  - "path-traversal"

# OPTIONAL — SPDX license identifier (e.g. "Apache-2.0", "MIT", "BSD-3-Clause").
# Only set if explicitly declared in a LICENSE file or by the author.
license: "Apache-2.0"

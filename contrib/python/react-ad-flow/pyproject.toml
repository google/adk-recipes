[project]
name = "react-ad-flow"
version = "0.1.0"
description = "Retail ad campaign management agent with video generation for in-store media networks"
requires-python = ">=3.11,<3.14"
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "gdown>=5.2.0",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.111",
    "google-cloud-storage>=2.19.0",
    "google-genai>=2.14.0",
    "googlemaps>=4.10.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pillow>=13.0.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Use public PyPI as the default index for this recipe.
[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

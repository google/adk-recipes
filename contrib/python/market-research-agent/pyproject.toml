[project]
name = "market-research-agent"
version = "0.1.0"
description = "A multi-agent system that performs comprehensive market research for any location and business type using Google Places API."
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.156.0,<2.0.0",
    "google-genai>=1.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=2.6.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Lifts an upstream cap that holds a known CVE in the lock:
# `google-cloud-aiplatform[evaluation]` caps litellm below 1.86
# (GHSA-3cv6-jpf6-8222 is fixed in 1.88.6). Only uv applies overrides, so the
# Dockerfile's `uv sync` gets it. The upper bound is the one aiplatform sets
# for Python 3.14. Remove once the upstream cap admits the fix.
override-dependencies = [
    "litellm>=1.88.6,<1.97",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

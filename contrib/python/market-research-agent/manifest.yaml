  libraries:
    - "ADK"
    - "httpx"
    - "pydantic"
  services:
    - "Google Places API"
    - "Google Maps Geocoding API"
    - "Vertex AI"

ownership:
  team: "nikhithajoy"
  poc: "nikhithajoy"

tags:

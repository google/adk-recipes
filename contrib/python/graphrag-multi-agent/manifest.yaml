type: "standalone"    # Options: [standalone | module]
status: "active"      # Options: [active | inactive]
language: "python"    # Options: [python | java | go | kotlin | typescript]
description: "Multi-agent GraphRAG system that answers investment-research questions over a Neo4j knowledge graph using Text-to-Cypher, a custom investor tool, and optional MCP Toolbox queries."

architecture:
  agent: "multi"       # Options: [single | multi]
  stateful: false      # Options: [true | false]
  datasources:         # Options: [hardcoded | local | external]
    - "external"

dependencies:
  libraries:
    - "google-adk"
    - "neo4j"
  services:
    - "Neo4j"
    - "Gemini API"

ownership:
  team: "community"
  poc: "JOFLOX"

tags:
  - "graphrag"
  - "knowledge-graph"
  - "neo4j"
  - "cypher"
  - "multi-agent"
  - "mcp-toolbox"
  - "gemini"

license: "Apache-2.0"  # SPDX identifier

[project]
name = "google-trends-agent"
version = "0.1.0"
description = "Multi-agent system that turns natural-language questions into BigQuery SQL over the Google Trends public dataset and interprets the results."
authors = [
    { name = "Yehia Elshater", email = "elshater@google.com" },
]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "google-cloud-aiplatform[adk,agent-engines]>=1.104.0,<2.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "google-genai>=1.26.0,<2.0.0",
    "google-cloud-bigquery>=3.35.0,<4.0.0",
    "google-adk>=1.31.0,<2.0.0",
    "pandas>=2.3.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.7",
    "google-adk[eval]>=1.31.0",
    "nest-asyncio>=1.6.0",
]
deployment = [
    "absl-py>=2.2.2",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
# Ensures Hatchling finds the package folder correctly.
packages = ["app"]

[tool.agent-starter-pack]
example_question = "What's trending in AI Engineering today?"

[tool.agent-starter-pack.settings]
agent_directory = "app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

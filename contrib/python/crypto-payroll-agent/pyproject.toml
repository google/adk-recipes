[project]
name = "crypto-payroll-agent"
version = "0.1.0"
description = "Batch-pays many recipients in ETH or ERC-20 tokens on Base in a single transaction using the Spraay tools from google-adk-community, splitting a pool proportionally by weight and gating every on-chain batch behind a human-in-the-loop USD ceiling."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "plagtech", email = "hello@spraay.app" },
]
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=1.0.0",
    # 0.5.0 is the first PyPI release carrying the Spraay tools merged in
    # adk-python-community#95, and is the version uv.lock resolves and the
    # tests run against. The floor is a minimum rather than an exact pin so
    # patch releases still install, but treat 0.5.0 as the tested version.
    # The `spraay` extra is required, not cosmetic: `web3` is declared there
    # as an optional dependency, and the batch tools import it at call time.
    "google-adk-community[spraay]>=0.5.0",
    "google-cloud-aiplatform[adk,agent_engines]>=1.95.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crypto_payroll_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

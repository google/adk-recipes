type: standalone
status: active
language: python
description: Deployable retail virtual try-on ADK agent supporting image and catwalk video try-ons via Gemini image models and Veo on Gemini Enterprise Agent Platform, with boolean flags for Agent Engine, Gemini Enterprise App, Cloud Run, and local web UI.
license: Apache-2.0
deployable: true
architecture:
  agent: single
  stateful: false
  datasources:
    - external
dependencies:
  libraries:
    - google-adk
    - google-genai
    - google-cloud-storage
    - pillow
    - fastapi
    - uvicorn
    - a2a-sdk
  services:
    - vertex-ai
    - cloud-storage
    - cloud-run
ownership:
  team: FDE/Blackbelt
  poc: tanvisinghal-0105
  contributors:
    - gabrielahrlr
tags:
  - retail
  - virtual-tryon
  - image-generation
  - video-generation
  - a2a

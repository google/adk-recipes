[project]
name = "retail-product-search"
version = "0.2.0"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.2.0",
    "google-cloud-bigquery>=3.0",
    "google-cloud-storage>=2.0",
    "google-cloud-vectorsearch>=0.5,<1.0",
    "google-cloud-aiplatform[agent-engines]>=1.156.0,<2.0.0",
    "google-genai>=1.0",
    "pyOpenSSL>=23.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -v"
log_cli = true
log_cli_level = "INFO"

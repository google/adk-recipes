[project]
name = "high-volume-document-analyzer"
version = "0.1.0"
description = "The High-Volume Document Analyzer Agent queries and synthesizes information from a large corpus of internal documents (legal statutes, process manuals, etc.)"
authors = [
    { name = "Mikaeri Ohana", email = "mikaeri@google.com" },
    { name = "Afonso Menegola", email = "afonsomenegola@google.com" },
]
maintainers = [
    { name = "Mikaeri Ohana", email = "mikaeri@google.com" },
]

license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-adk>=1.28.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.93.0",
    "opentelemetry-instrumentation-google-genai>=0.4b0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.0",
    "pypdf>=6.17.0",
    "requests>=2.33.0",
    "pandas>=2.3.3",
    "beautifulsoup4>=4.14.3",
    "aiohttp>=3.14.3",
    "google-cloud-secret-manager>=2.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "agent-starter-pack>=0.15.4",
    "flask>=3.1.3",
    "ruff>=0.4.6",
    "mypy>=1.15.0",
    "codespell>=2.2.0",
    "types-pyyaml>=6.0.12.20240917",
    "types-requests>=2.32.0.20240914",
    "uvicorn>=0.37.0",
]


[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_subclassing_any = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
follow_imports = "silent"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["misc", "no-untyped-call", "no-any-return"]

exclude = [".venv"]

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/*.ipynb"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.agent-starter-pack]
template_id = "adk-agent"
agent_module = "app.agent"
agent_object = "app"
example_question = "Analyze documents for collection 12345"

[tool.agent-starter-pack.settings]
agent_directory = "app"
deployment_targets = ["agent_engine", "cloud_run"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
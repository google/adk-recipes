  libraries:
    - "google-adk"
    - "playwright"
    - "google-cloud-bigquery"
    - "google-genai"
    - "pydantic"
    - "pillow"
  services:
    - "BigQuery"
    - "Vertex AI"

ownership:
  team: "FDE"
  poc: "anaelledrai"
  contributors:
    - "happyhuman"

tags:
  - "retail"
  - "search-optimization"
  - "computer-use"
  - "multi-agent"


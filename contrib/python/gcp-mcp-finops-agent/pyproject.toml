[project]
name = "gcp-mcp-finops-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[mcp]>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Use public PyPI as the default index for this recipe.
[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
# Integration tests require live credentials and are excluded from CI.
# Run them locally with: uv run pytest tests/integration
addopts = "--ignore=tests/integration"

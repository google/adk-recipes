type: standalone
status: active
language: python
deployable: true
description: Session-stable semantic tool routing and result caching for ADK agents with large tool catalogs, paired with BigQuery Agent Analytics and BigQuery ML.
license: Apache-2.0

architecture:
  agent: single
  stateful: false
  datasources:
    - external
dependencies:
  libraries:
    - adk-smart-router
    - google-adk
    - google-cloud-aiplatform
    - google-cloud-bigquery
    - google-cloud-storage
    - google-genai
  services:
    - gemini-enterprise
    - bigquery
    - cloud-storage
    - cloud-run
ownership:
  team: cloud-gtm/agentic-data-science
  poc: statmike
tags:
  - tool-routing
  - context-caching
  - bigquery
  - observability

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ambient-quality-agent"
dynamic = ["version"]
description = "On-demand production intelligence sidecar agent built with Google Agent Development Kit (ADK)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Google LLC" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Direct rather than via `google-adk[a2a]`, which floors at 0.3.4: the 0.3
    # wire dialect renders blank in the dashboard's A2A client, with no error.
    # `[http-server]` adds sse-starlette; without it `import a2a.server.routes`
    # fails, and so does `adk deploy agent_engine`'s unconditional `--a2a` CMD.
    "a2a-sdk[http-server]>=1.0,<2",
    # The session reviewer runs Claude review models on ADK's `Claude`, which
    # needs the Anthropic SDK's Vertex AI client. The floor is the version the
    # tests run against; the cap keeps out an untested major release, as
    # `_ReviewClaude` overrides a private ADK property.
    "anthropic[vertex]>=2.3,<3",
    # The session reviewer shares one genai client across the event loops of
    # concurrent review threads, which requires genai's aiohttp transport (one
    # session per event loop). Declared directly so we do not rely on a
    # transitive dependency.
    "aiohttp>=3.14.3",
    # The engine decides on each scheduler tick whether an agent's cron fell
    # due.
    "croniter>=6.2,<7",
    "google-adk>=2.13.0",
    # 2.0.1 is the first release whose `agentplatform.Client` has `runtimes`,
    # which investigation scheduling calls to submit its query job.
    "google-cloud-aiplatform[evaluation]>=2.0.1,<3",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-logging>=3.16.2",
    "google-cloud-storage>=3.17.1",
    "google-cloud-tasks>=2.24.0",
    # The session reviewer's `query_trajectory` tool runs model-written jq
    # expressions over the session document.
    "jq>=1.8",
    # Direct: the GCS span exporter builds on the tracing API and SDK (tracer
    # provider, batch processor, `SpanExporter`). Available transitively today,
    # which is not a contract.
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "pydantic==2.14.1",
    # Direct: the package loads its `.env` with it. Available transitively
    # today, which is not a contract. 1.2 is the first release that honors
    # `PYTHON_DOTENV_DISABLED`, which the tests and dev scripts set.
    "python-dotenv>=1.2.0",
    # Direct: the code-metric library reads its `eval_config.yaml` with it.
    # Available transitively today, which is not a contract.
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
lint = [
    "ruff",
    "ty",
]

[project.urls]
Homepage = "https://github.com/google/adk-recipes/tree/main/core/python/ambient-quality-agent"
Repository = "https://github.com/google/adk-recipes/tree/main/core/python/ambient-quality-agent"

[tool.hatch.version]
path = "src/ambient_quality_shared/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ambient_quality_agent", "src/ambient_quality_shared"]

[tool.uv]
override-dependencies = [
    "filelock>=4.2.1,<5",
    "litellm>=1.88.6,<1.97",
    "opentelemetry-api>=1.45.1,<1.46",
    "opentelemetry-sdk>=1.45.1,<1.46",
    "pyopenssl>=26.4,<27",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "cloudpickle>=3.1.2",
    "google-agents-cli>=1.10",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
# Discovers directory-specific test suites, allowing trees omitting optional
# directories to run `tests` alone.
testpaths = [
    "tests",
    "quality",
    "tools",
    "tools_internal",
    "plugins/adk-otel-aqua/tests",
]
# Restricts collection to `test_*.py` so that modules named `*_test.py`, such
# as load generators, are not executed as tests.
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    # Tests that assert the installed `google-agents-cli` still behaves as this
    # repo's metric loader assumes. They fail when upstream changes a rule,
    # which is the point, so the marker exists to name them in that report.
    "parity: checks this repo against the installed agents-cli",
]
# Only `ambient_quality_agent` is installed.
#
# "ui" is where the dashboard's app.py lives, and it is imported as a top-level
# `app` module because the image flattens it to the root; the UI tests import it
# the same way.
# "extension" allows `tests/test_acli_extension.py` to import standalone
# extension wrappers as top-level modules.
# "." makes the repo-root `quality` prompt-tuning harness importable.
# "plugins/adk-otel-aqua/src" holds the uninstalled plugin package, which is
# imported from its own source directory.
# "plugins/adk-otel-aqua/recorder" holds the plugin's telemetry recorder, whose
# formatters and host command the plugin tests import.
pythonpath = [
    "src",
    "ui",
    "extension",
    ".",
    "plugins/adk-otel-aqua/src",
    "plugins/adk-otel-aqua/recorder",
]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv).
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.11"
# tools_internal/e2e imports release.py from its own directory, as the release
# scripts import each other.
# The plugin tests import the uninstalled adk_otel_aqua package from its source
# directory, and the plugin's recorder from its own directory.
extra-paths = [
    "tools_internal/release",
    "plugins/adk-otel-aqua/src",
    "plugins/adk-otel-aqua/recorder",
]

[tool.ty.rules]
# Ignore missing third-party type stubs.
unresolved-import = "ignore"

[[tool.ty.overrides]]
# Relax type checking for tests (pytest fixtures with yield have complex types).
# Tests also assert on optional SDK eval-case fields (Content | None,
# list | None) right after constructing them, where narrowing every access
# would only add noise.
include = ["tests/**", "quality/test_*.py", "tools/test_*.py"]

[tool.ty.overrides.rules]
invalid-return-type = "ignore"
not-subscriptable = "ignore"
not-iterable = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"

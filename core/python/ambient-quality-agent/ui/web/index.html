<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>AQuA</title>
    <meta
      name="description"
      content="A self-improving coding agent built on Google's ADK, with a web UI over A2A."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Google Sans and Google Sans Code, from Google Fonts. Google Sans comes
         with its optical-size axis, which opsz-text and opsz-display choose
         between, and both come with real italics for markdown. A browser
         downloads only the subsets a page's characters need. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap"
    />
    <!-- Boot script sets content from the saved theme; default matches the
         dark --background. Must precede THEME_BOOT so getElementById finds it. -->
    <meta name="theme-color" id="lha-theme-color" content="#101010" />
    <script>
      // Runs before paint to apply saved appearance (theme + skin)
      // — prevents a flash of the wrong scheme/accent when a non-default is
      // saved. Must agree with THEME_COLOR, DEFAULT_THEME_CHOICE and
      // DARK_QUERY in lib/use-appearance.ts and the [data-skin] selectors in
      // globals.css. The system preference has
      // to be resolved here rather than left to React: by the time a component
      // mounts, the wrong scheme has already been painted.
      (() => {
        var root = document.documentElement;
        var dark = true,
          skin = null,
          t;
        try {
          t = localStorage.getItem("lha.theme");
          if (t === "dark" || t === "light") {
            dark = t === "dark";
          } else if (window.matchMedia) {
            // Unset or "system": follow the OS, as the old dashboard's Auto
            // did. Dark stays the answer for a browser that cannot be asked.
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          skin = localStorage.getItem("lha.skin") || "slate";
        } catch {}
        root.classList.toggle("dark", dark);
        if (skin && skin !== "default") root.dataset.skin = skin;
        var meta = document.getElementById("lha-theme-color");
        if (meta) meta.setAttribute("content", dark ? "#101010" : "#fefdfb");
      })();
    </script>
  </head>
  <body class="min-h-dvh bg-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# What `agents-cli` reads to find the agent. Without it, `deploy` refuses to run.
#
# A deploy has to override two values to reach a Terraform-created deployment:
# `--service-name <observed agent>-aqua` for the name below, and the region if
# the module was applied outside `us-central1`.
name: ambient-quality-agent
agent_directory: src/ambient_quality_agent
region: us-central1
language: python
create_params:
  # `agent_runtime` lets Agent Runtime build the image; cloud_run and gke would
  # need one built and pushed.
  deployment_target: agent_runtime
  session_type: none

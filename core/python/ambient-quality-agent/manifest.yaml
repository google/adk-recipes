type: "standalone"
status: "active"
language: "python"
description: "On-demand production intelligence sidecar agent built with Google Agent Development Kit (ADK)."
# Categorized as large because the agent, extension, Terraform module, and web
# dashboard total ~730 files, exceeding the standard 500-file tier for core/ recipes.
large: true
license: "Apache-2.0"

architecture:
  agent: "multi"
  stateful: true
  datasources:
  - "external"

dependencies:
  libraries:
  - "adk"
  - "a2a-sdk"
  services:
  - "vertex-ai"
  - "agent-engine"
  - "bigquery"
  - "cloud-storage"
  - "cloud-tasks"
  - "cloud-scheduler"
  - "cloud-run"
  - "cloud-logging"
  - "pubsub"

tags:
- "observability"
- "evaluation"
- "ambient"
- "root-cause-analysis"
- "telemetry"
- "agents-cli-extension"

ownership:
  team: "adlc-devex"
  poc: "maxgasztych"

# Builds the computer image for linux/amd64 (GCE computers) and linux/arm64 (the docker
# provider on Apple Silicon) as one multi-arch tag, so `docker pull` gets the native
# image everywhere instead of an amd64 one under emulation.
#
#   gcloud builds submit sandbox --config=sandbox/cloudbuild.yaml \
#     --substitutions=_IMAGE=<region>-docker.pkg.dev/<project>/<repo>/computer:<tag>
#
# The arm64 half is built under QEMU, so it takes longer than the amd64 half. Locally,
# `docker build sandbox` builds for the machine's own platform; nothing else is needed.
steps:
  - id: multiarch
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        docker run --privileged --rm tonistiigi/binfmt --install arm64
        docker buildx create --name multiarch --driver docker-container --use
        docker buildx build --platform linux/amd64,linux/arm64 --tag "${_IMAGE}" --push .
substitutions:
  _IMAGE: ""
options:
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true
timeout: 3600s

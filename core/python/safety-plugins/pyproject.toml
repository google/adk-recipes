[project]
name = "safety-plugins"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "absl-py>=2.3.1",
    "google-adk>=1.28.0",
    "google-auth>=2.30.0",
    "google-cloud-modelarmor>=0.2.8",
    "google-genai>=1.5.0",
    "pdfplumber>=0.11.5",
    "pydantic>=2.11.7",
    "pydantic-core>=2.33.2",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.14.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.93.0",
]

[dependency-groups]
dev = [
    "agent-starter-pack>=0.14.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.4.6",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.agent-starter-pack]
example_question = "Can you run the short sum tool for me?"

[tool.agent-starter-pack.settings]
agent_directory = "safety_plugins"

[tool.hatch.build.targets.wheel]
# Ensure Hatchling finds the safety package even if there's a name collision
packages = ["safety_plugins"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

# Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      # ruff check --fix and ruff format on the staged files, with the same
      # rules and flags as make lint (the Makefile's RUFF_CONFIG and RUFF_RULES);
      # a bare `ruff` would use its defaults, as the recipe has no ruff config.
      # Fails when it changed a file or a finding has no automatic fix.
      - id: ruff
        name: ruff (make format)
        entry: bash -c 'make --no-print-directory format FILES="$*"' --
        language: system
        types: [python]
        require_serial: true
      - id: detect-secrets
        name: detect-secrets
        # Skipped without the baseline (internal-only, see .gitignore).
        entry: bash -c 'if [ -f .secrets.baseline ]; then exec uv run detect-secrets-hook --baseline .secrets.baseline "$@"; else echo "skipped (no baseline)"; fi' --
        language: system
        types: [text]
        exclude: package-lock.json
      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        types: [text]
        # Same paths as [tool.codespell] skip, which codespell ignores for files passed explicitly.
        exclude: ^(uv\.lock|frontend/|assets/)|\.ipynb$

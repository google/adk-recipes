type: "standalone"   # Options: [standalone | module]
status: "active"     # Options: [active | inactive]
language: "python"   # Options: [python | java | go | kotlin | typescript]
description: "An ADK agent and Gemini workflows for retail media: image and video virtual try-on, 360° product spins and catalogue search, with every result checked for product fidelity"

architecture:
  agent: "single"       # Options: [single | multi]
  stateful: true        # Options: [true | false]
  datasources:          # Options: [hardcoded | local | external]
    - "external"

dependencies:
  libraries:
    - "ADK"
    - "FastAPI"
    - "MCP"
    - "React"
  services:
    - "Vertex AI"
    - "Cloud Storage"
    - "Cloud Run"
    - "Gemini Enterprise"

ownership:
  team: "Forward Deployed Engineering (FDE)"
  poc: "lspatarog"
  contributors:
    - "giuliosalierno"
    - "javierpitagg"

tags:
  - "retail"
  - "virtual-try-on"
  - "video-generation"
  - "image-generation"
  - "mcp"
  - "full-stack"

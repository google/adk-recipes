[project]
name = "genmedia-for-commerce"
version = "0.1.0"
description = "An ADK agent and Gemini workflows for retail media: image and video virtual try-on, 360° product spins and catalogue search, with every result checked for product fidelity"
authors = [
    { name = "Lorenzo Spataro", email = "lspataro@google.com" },
    { name = "Giulio Salierno", email = "giuliosalierno@google.com" },
    { name = "Javier Pita", email = "javierpita@google.com" },
]
license = { text = "Apache License 2.0" }
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # ADK & Agent infrastructure
    "google-adk>=2.12.0,<3.0.0",
    # Traces the direct google-genai calls; inactive with google-genai 2 until
    # ADK allows OpenTelemetry 1.43 (plugin 1.1+, which supports genai 2).
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    # ADK exports traces, metrics and logs to Google Cloud on Cloud Run
    # (get_fast_api_app(otel_to_cloud=True)) with these two.
    "opentelemetry-exporter-otlp-proto-http>=1.39",
    "opentelemetry-resourcedetector-gcp>=1.9.0a0,<2",
    # ADK resolves the project number with it to name the agent in its
    # telemetry (agent URN); from google-adk[gcp], whose other packages we
    # do not need.
    "google-cloud-resource-manager>=1.12,<2",
    # Web framework
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn[standard]>=0.46.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.2",
    # Google AI
    "google-genai>=2.30.1,<3.0.0",
    "google-auth>=2.47.0",
    # Image/Video processing (pillow, numpy: imported directly, so declared)
    "pillow>=12.0",
    "numpy>=2.0",
    "scikit-image>=0.25.2",
    "opencv-python-headless>=4.12.0.88",
    "google-cloud-vision>=3.9.0",
    "google-cloud-storage>=2.19.0",
    # MCP
    "mcp[cli]>=1.27.0",
    # Catalogue search (in-memory)
    "pyarrow",
    "protobuf>=6.31.1,<7.0.0",
    # HEIC decoding only: its wheels carry no x265 encoder (GPL)
    "pi-heif-decoder>=1.7.0.post4",
    # Imported directly (also pulled in by other packages)
    "requests>=2.32",
    "pydantic>=2.0",
    "click>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.16.8",
    "codespell>=2.2.0",
    "detect-secrets>=1.5.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["genmedia4commerce"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real Google APIs"]

[tool.codespell]
ignore-words-list = "rouge,rotat,lightening"
# Skip patterns use fnmatch — directory names (no trailing /*) skip whole
# subtrees; filename globs (*foo) match basenames anywhere. Codespell
# prepends "./" to paths and `*` is not recursive, so `assets/*` would not match.
skip = "uv.lock,.venv,frontend,assets,**/*.ipynb,**/package-lock.json,**/node_modules"

[tool.agent-starter-pack]
base_template = "adk_base"
description = "A full-stack ADK app for retail media: image and video virtual try-on, 360° product spins and catalogue search with Gemini"
example_question = "Show this person wearing this jacket, then make a video of the result"

[tool.agent-starter-pack.settings]
name = "genmedia-for-commerce"
description = "Retail media agent: virtual try-on, 360° spins and catalogue search"
base_template = "adk"
agent_directory = "genmedia4commerce"
# One Cloud Run service runs the whole app (make deploy). agent_engine is legacy:
# kept only so Agent Garden's current `create -d agent_engine` works (it ends
# with make deploy-agent-engine, an alias of make deploy). Remove it once Agent
# Garden uses -d cloud_run.
deployment_targets = ["cloud_run", "agent_engine"]
interactive_command = "setup-infra && make dev"

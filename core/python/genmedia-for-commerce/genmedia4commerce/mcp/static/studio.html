<html lang="en">
<head>
<meta charset="utf-8">
<title>GenMedia Studio</title>
<style>
  /* The web app's design tokens (frontend/tailwind.config.js), light by
     default (Gemini Enterprise's page is white), dark from the host theme. */
  :root { color-scheme: light;
    --bg: #fff; --card: #fff; --soft: rgba(17,24,39,.04); --soft2: rgba(17,24,39,.08); --tab-on: #fff;
    --fg: #1f1f1f; --fg2: #5f6368; --fg3: #70757a; --line: #e4e6eb; --line2: #d3d6dc; --input: #fff;
    --acc: #8ab4f8; --ink: #1967d2; --acc-soft: rgba(138,180,248,.16); --acc-ring: rgba(138,180,248,.6);
    --grad: linear-gradient(135deg, #8ab4f8 0%, #a5c8fa 100%); --on-grad: #0b1220;
    --title: linear-gradient(90deg, #1967d2 0%, #4a90e2 100%);
    --glow: radial-gradient(900px 360px at 10% -10%, rgba(138,180,248,.16), transparent 60%);
    --ok: #188038; --warn: #b06000; --err: #c5221f;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow2: 0 4px 12px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.06); }
  html[data-theme="dark"] { color-scheme: dark;
    --bg: #050505; --card: rgba(255,255,255,.03); --soft: rgba(255,255,255,.04); --soft2: rgba(255,255,255,.08);
    --tab-on: rgba(255,255,255,.09); --fg: #fff; --fg2: #a1a1aa; --fg3: #8b8b94;
    --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.14); --input: rgba(0,0,0,.3);
    --ink: #8ab4f8; --acc-soft: rgba(138,180,248,.12); --acc-ring: rgba(138,180,248,.45);
    --title: linear-gradient(90deg, #8ab4f8 0%, #fff 100%);
    --glow: radial-gradient(1200px 520px at 15% -10%, rgba(138,180,248,.10), transparent 60%),
            radial-gradient(900px 480px at 100% 0%, rgba(165,200,250,.06), transparent 60%);
    --ok: #34d399; --warn: #fbbf24; --err: #f87171;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px -12px rgba(0,0,0,.6);
    --shadow2: 0 12px 40px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; color: var(--fg); background-color: var(--bg);
         background-image: var(--glow); background-repeat: no-repeat;
         font: 14px/1.5 "Google Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  ::selection { background: rgba(138,180,248,.3); }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 0 4px 0 0;
              background: var(--title); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
  .tab { border: 0; background: none; color: var(--fg2); border-radius: 8px; padding: 7px 14px;
         font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--fg); background: var(--soft); }
  .tab.on { color: var(--fg); background: var(--tab-on); box-shadow: var(--shadow2), inset 0 0 0 1px var(--line2); }
  .spacer { flex: 1; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
            margin: 12px 0; box-shadow: var(--shadow); }
  section h2 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; margin: 0 0 8px;
               display: flex; gap: 8px; align-items: center; }
  .hint { color: var(--fg2); font-size: 12px; margin: 2px 0 8px; }
  .btn { border: 1px solid var(--line2); background: var(--soft); color: var(--fg); border-radius: 8px;
         padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 500; text-decoration: none;
         display: inline-flex; align-items: center; gap: 6px; transition: background .2s, border-color .2s; }
  .btn:hover:not(:disabled) { background: var(--acc-soft); border-color: var(--acc-ring); }
  .btn.primary { background: var(--grad); color: var(--on-grad); border: 0; border-radius: 12px; padding: 11px 22px;
                 font-weight: 600; font-size: 14px; box-shadow: 0 2px 12px rgba(138,180,248,.25);
                 transition: box-shadow .3s, transform .3s; }
  .btn.primary:hover:not(:disabled) { box-shadow: 0 4px 20px rgba(138,180,248,.35); transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary:disabled { opacity: 1; background: var(--soft2); color: var(--fg3); box-shadow: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .between { justify-content: space-between; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px;
          font-size: 11px; font-weight: 500; line-height: 16px; white-space: nowrap; font-variant-numeric: tabular-nums;
          background: var(--soft2); color: var(--fg2); }
  .chip.ok, .chip.warn, .chip.err, .chip.acc { background: color-mix(in srgb, currentColor 12%, transparent);
          box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 28%, transparent); }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.err { color: var(--err); } .chip.acc { color: var(--ink); }
  .sel { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: 12px; margin: 6px 0;
         background: var(--soft); border: 1px solid var(--line); }
  .sel img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  .sel .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 4px; cursor: pointer; background: var(--card);
          text-align: center; font-size: 11px; color: var(--fg); transition: border-color .2s, box-shadow .2s; }
  .tile:hover { border-color: var(--acc-ring); box-shadow: 0 0 0 3px rgba(138,180,248,.15); }
  .tile img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; display: block; }
  .tile span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; }
  details > summary { cursor: pointer; color: var(--fg2); font-weight: 500; margin: 8px 0; }
  details > summary:hover { color: var(--fg); }
  input[type=text], textarea, select { font: inherit; color: var(--fg); background: var(--input);
         border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; }
  input[type=text]:focus, textarea:focus, select:focus { outline: none; border-color: var(--acc);
         box-shadow: 0 0 0 3px rgba(138,180,248,.25); }
  input[type=text], textarea { width: 100%; }
  input[type=checkbox], input[type=radio] { accent-color: #4a90e2; }
  label.f { display: block; margin: 6px 0 4px; color: var(--fg2); font-size: 12px; font-weight: 500; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .res { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--card);
         box-shadow: var(--shadow); display: flex; flex-direction: column; transition: box-shadow .2s, border-color .2s; }
  .res > img, .res > video, .res > a > img { width: 100%; display: block; background: var(--soft); }
  .res > a > img { object-fit: contain; }
  .res .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .res .body .row { margin: 0; }
  .res .body .btn { align-self: flex-start; }
  .res.best { border-color: var(--acc-ring); box-shadow: 0 0 40px rgba(138,180,248,.2); }
  .res.hl { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(138,180,248,.35); }
  .link { border: 0; background: none; padding: 0; color: var(--ink); font: inherit; font-size: 12px;
          font-weight: 500; cursor: pointer; align-self: flex-start; }
  .link:hover { text-decoration: underline; }
  .status { color: var(--fg2); font-size: 12px; }
  .err { color: var(--err); }
  .alert { color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent); border-radius: 12px;
           border: 1px solid color-mix(in srgb, var(--err) 25%, transparent); padding: 8px 12px; margin: 8px 0; }
  .warn { color: var(--warn); font-size: 12px; margin: 4px 0; }
  .noprev { aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center;
            background: var(--soft); color: var(--fg3); font-size: 12px; }
  .hidden { display: none !important; }
  .shim { width: 100%; background: linear-gradient(90deg, var(--soft) 25%, var(--soft2) 50%, var(--soft) 75%);
          background-size: 200% 100%; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <h1>GenMedia Studio</h1>
  <div id="tabs" class="row"></div>
  <span class="spacer"></span>
</header>
<main id="page"></main>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" multiple class="hidden">

<script>
(() => {
  // ---- state ---------------------------------------------------------------
  // The server owns the studio (studio/state.py): every user action is sent
  // with studio_event and the panel renders the state it gets back. `S` is
  // that state, ready to render; `L` holds what only this panel knows.
  const CAPS = { tryon: "Photo Try-On", video_tryon: "Video Try-On", spin: "360° Spin" };
  const CAP_KEYS = ["tryon", "video_tryon", "spin"];
  // Shown until the studio sets them.
  const DEFAULTS = {
    tryon: { scenario: "", style_guidelines: "", aspect_ratio: "3:4", image_size: "2K", num_variations: "3",
             complete_look: true, upscale_crops: false, check_images: false, check_videos: false },
    video_tryon: { motion: "auto", prompt: "", aspect_ratio: "9:16", resolution: "720p", num_variations: "3" },
    spin: { aspect_ratio: "auto", resolution: "720p", num_variations: "1" },
  };
  function blank() {
    return {
      capability: "tryon", person: null, reference_model: null, products: [], spin: [],
      settings: { tryon: { ...DEFAULTS.tryon }, video_tryon: { ...DEFAULTS.video_tryon }, spin: { ...DEFAULTS.spin } },
      results: { tryon: [], video_tryon: [], spin: [] },
      images: [],  // the try-on images of the last video try-on (state.images.video_tryon)
      job: null,
    };
  }
  let S = blank();
  let stateAt = 0;  // updated_at of the state shown
  const L = {
    jobStatus: "", jobError: "", notice: "",
    // The generation being followed: {cap, results, images, tryon (the image a Make video job redoes),
    // expected, made and failed (front variations per list, see counts)}.
    live: null,
    retry: null,  // {cap, spec, tryon} of the last generation started or followed, for "Try again"
    // The products picker: the featured products until a search (shown: its query).
    catalog: { query: "", audience: "", shown: "", items: [], busy: false, error: "" },
    // The people, products and spin-set galleries: collapsed until the user opens them (kept across redraws).
    open: { people: false, products: false, spinSets: false },
    uploads: [],  // files being uploaded: {key, field, thumb}, shown where they will land
  };
  let G = { models: [], spin: [] };  // the catalogue's preset models and multi-view sets
  const randomBytes = (n) => crypto.getRandomValues(new Uint8Array(n));
  const randomHex = (n) => Array.from(randomBytes(n), b => b.toString(16).padStart(2, "0")).join("");
  let connected = false, uploadTarget = null;
  let canWrite = false;  // only once the saved studio was read: never write over it
  let restoreRun = 0, restoreMsg = "";  // restore attempts; their message
  let nextId = 1 + (new DataView(randomBytes(4).buffer).getUint32(0) >>> 1);  // request ids
  let studioId = randomHex(6);
  const thumbs = new Map();  // ref or result uri -> browser URL
  const copies = new Map();  // catalogue pick ref -> its gs:// copy
  const pending = new Map();

  // ---- data from the host and the server --------------------------------------
  // The server keeps only known fields and settings; the panel still reads
  // what it renders defensively: known keys, plain values, safe URLs.
  const ITEM_KEYS = ["label", "ref", "thumb"];
  // source: its image's uri; video_url: a spin's MP4
  const RESULT_KEYS = ["index", "status", "score", "uri", "url", "view", "note", "source", "video_url"];
  const IMAGE_KEYS = ["index", "status", "score", "uri", "url", "note", "run", "passed"];
  const isObj = (x) => x !== null && typeof x === "object" && !Array.isArray(x);
  const isPrim = (v) => typeof v === "string" || typeof v === "number" || typeof v === "boolean";
  const arr = (x) => (Array.isArray(x) ? x : []);
  const str = (x) => (typeof x === "string" ? x : "");
  // The allowed constant equal to `value`, or null.
  function oneOf(allowed, value) { for (const k of allowed) if (k === value) return k; return null; }
  const capOf = (c) => oneOf(CAP_KEYS, c);
  function cleanItem(x) {
    if (!isObj(x) || typeof x.ref !== "string") return null;
    const o = {};
    for (const k of ITEM_KEYS) if (Object.hasOwn(x, k) && typeof x[k] === "string") o[k] = x[k];
    return o;
  }
  function cleanResult(r, keys) {
    if (!isObj(r)) return null;
    const o = {};
    for (const k of keys) if (Object.hasOwn(r, k) && (isPrim(r[k]) || r[k] === null)) o[k] = r[k];
    return o;
  }
  // Browser URLs: https, or inline images and videos; anything else is dropped.
  function safeUrl(u) {
    if (typeof u !== "string") return "";
    if (/^data:(image|video)\/[a-z0-9.+-]+[;,]/i.test(u)) return u;
    try { return new URL(u).protocol === "https:" ? u : ""; } catch (_) { return ""; }
  }
  // Results with their preview URLs: the server's, else the ones already seen.
  function resultsOf(list, keys) {
    return arr(list).map(r => cleanResult(r, keys || RESULT_KEYS)).filter(Boolean).map(r => {
      if (typeof r.uri === "string" && typeof r.url === "string" && r.url) thumbs.set(r.uri, r.url);
      else if (typeof r.uri === "string") r.url = thumbs.get(r.uri) || "";
      return r;
    });
  }
  // A job's front variations per list: how many it makes (expected) or ended without media (failed).
  function counts(x) {
    const o = isObj(x) ? x : {}, n = (k) => Math.max(0, Math.floor(Number(o[k])) || 0);
    return { image_results: n("image_results"), results: n("results") };
  }
  // The front variations a job status holds per list (its try-on images, its results).
  const fronts = (list) => arr(list).filter(r => isObj(r) && r.view !== "back").length;
  // Video try-on images (state.images.video_tryon, a job's images): each has its uri.
  const imagesOf = (list) => resultsOf(list, IMAGE_KEYS).filter(m => typeof m.uri === "string" && m.uri);
  // A state from the server, ready to render.
  // Keys of old studios (video_start, tryon_image, source) are ignored.
  function fromServer(st) {
    const s = blank();
    const cap = capOf(st.capability);
    if (cap) s.capability = cap;
    s.person = withThumb(st.person);
    s.reference_model = withThumb(st.reference_model);
    s.products = arr(st.products).map(withThumb).filter(Boolean);
    s.spin = arr(st.spin).map(withThumb).filter(Boolean);
    const settings = isObj(st.settings) ? st.settings : {};
    const results = isObj(st.results) ? st.results : {}, images = isObj(st.images) ? st.images : {};
    for (const c of CAP_KEYS) {
      const page = Object.hasOwn(settings, c) && isObj(settings[c]) ? settings[c] : {};
      for (const k of Object.keys(DEFAULTS[c])) if (Object.hasOwn(page, k) && isPrim(page[k])) s.settings[c][k] = page[k];
      // Kept without a usable url too (its preview could not be renewed).
      s.results[c] = resultsOf(Object.hasOwn(results, c) ? results[c] : []).filter(r => r.uri || r.url);
    }
    s.images = imagesOf(Object.hasOwn(images, "video_tryon") ? images.video_tryon : []);
    // Studios saved with the old catwalk / turnaround motions.
    if (s.settings.video_tryon.motion !== "custom") s.settings.video_tryon.motion = "auto";
    const job = isObj(st.job) ? st.job : null;
    if (job && typeof job.job_id === "string" && job.job_id && capOf(job.capability))  // tryon: a Make video's image
      s.job = { id: job.job_id, capability: capOf(job.capability), tryon: str(job.tryon_image) };
    return s;
  }

  // ---- host bridge ---------------------------------------------------------
  const post = (m) => { if (window.parent !== window) window.parent.postMessage(m, "*"); };
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params: params || {} });
  function request(method, params, ms) {
    return new Promise((resolve, reject) => {
      if (window.parent === window) return reject(new Error("no host"));
      const id = nextId++;
      const t = setTimeout(() => { pending.delete(id); reject(new Error("timeout: " + method)); }, ms || 60000);
      pending.set(id, { resolve, reject, t });
      post({ jsonrpc: "2.0", id, method, params: params || {} });
    });
  }
  // A tool's payload: its structuredContent, else its text as JSON. Errors
  // raised by a tool come back as plain text: `{error: text}`.
  function payload(r) {
    if (isObj(r.structuredContent)) return r.structuredContent;
    const text = arr(r.content).filter(c => isObj(c) && typeof c.text === "string").map(c => c.text).join("\n");
    if (!text) return {};
    try {
      const v = JSON.parse(text);
      return isObj(v) ? v : { error: text };
    } catch (_) { return { error: text }; }
  }
  async function tool(name, args) {
    const r = await request("tools/call", { name, arguments: args || {} }, 120000);
    if (!isObj(r)) throw new Error("tool failed");
    const sc = payload(r);
    if (r.isError) throw new Error(str(sc.error) || "tool failed");
    return sc;
  }
  let lastH = 0;
  function reportHeight() {
    const h = Math.ceil(document.documentElement.scrollHeight);
    if (Math.abs(h - lastH) > 4) { lastH = h; notify("ui/notifications/size-changed", { height: h }); }
  }

  // ---- items and thumbnails -------------------------------------------------
  const lean = (x) => x && { label: x.label, ref: x.ref };
  function remember(item) { if (item && item.ref && item.thumb) thumbs.set(item.ref, item.thumb); return item; }
  function withThumb(x) {
    const item = cleanItem(x);
    if (item) item.thumb = item.thumb || thumbs.get(item.ref) || "";
    return item;
  }
  function allItems() {
    return [S.person, S.reference_model, ...S.products, ...S.spin].filter(Boolean);
  }
  async function fillThumbs() {
    const missing = [...new Set(allItems().filter(i => !i.thumb && !thumbs.has(i.ref)).map(i => i.ref))];
    if (!missing.length || !connected) return;
    try {
      const r = await tool("studio_preview", { refs: missing });
      for (const [ref, url] of Object.entries(isObj(r.previews) ? r.previews : {}))
        if (typeof url === "string") thumbs.set(ref, url);
    } catch (_) { /* thumbnails are cosmetic */ }
    for (const i of allItems()) if (!i.thumb) i.thumb = thumbs.get(i.ref) || "";
    render();
  }
  // Catalogue picks come back as gs:// copies: they keep their thumbnails.
  function carryThumbs(refs) {
    for (const [from, to] of Object.entries(isObj(refs) ? refs : {})) {
      if (typeof to === "string") copies.set(from, to);
      if (typeof to === "string" && thumbs.has(from)) thumbs.set(to, thumbs.get(from));
    }
  }

  // ---- model context ---------------------------------------------------------
  const leanResult = (r) => ({ index: r.index, status: r.status, score: r.score, uri: r.uri, view: r.view, note: r.note,
                               source: r.source });
  const leanImage = (m) => ({ index: m.index, status: m.status, score: m.score, uri: m.uri, note: m.note, passed: m.passed });
  function snapshot() {
    const results = {};
    for (const cap of CAP_KEYS) results[cap] = S.results[cap].map(leanResult);
    return { capability: S.capability, person: lean(S.person), reference_model: lean(S.reference_model),
             products: S.products.map(lean), spin: S.spin.map(lean),
             settings: S.settings, results, images: { video_tryon: S.images.map(leanImage) },
             job: S.job ? { job_id: S.job.id, capability: S.job.capability } : null };
  }
  function summary() {
    const st = S.settings[S.capability];
    const lines = [`GenMedia Studio is open on ${CAPS[S.capability]} (studio_id: ${studioId};`
      + " pass it to studio_agent with the user's message)."];
    if (S.capability !== "spin") {
      lines.push(`Person: ${S.person ? S.person.label : "none"}.`);
      lines.push("Products: " + (S.products.map((p, i) => `${i}: ${p.label}`).join("; ") || "none") + ".");
      if (S.reference_model) lines.push(`Reference model: ${S.reference_model.label}.`);
    } else {
      lines.push("Spin photos: " + (S.spin.map(p => p.label).join("; ") || "none") + ".");
    }
    if (S.capability === "video_tryon" && S.images.length)
      lines.push("Try-on images: " + S.images.map((m, i) => `Image ${i + 1}, score ${m.score ?? "n/a"}`
        + (m.passed === false ? " (didn't pass every check)" : "")).join("; ") + ".");
    lines.push("Settings: " + JSON.stringify(st) + ".");
    if (makesTryOn()) {
      const { complete_look, upscale_crops } = S.settings.tryon;
      lines.push("Try-on options: " + JSON.stringify({ complete_look, upscale_crops }) + ".");
    }
    const { check_images, check_videos } = S.settings.tryon;
    lines.push("Checks: " + JSON.stringify({ check_images, check_videos }) + ".");
    const res = S.results[S.capability];
    if (S.job || polling) lines.push(`A generation is running (${L.jobStatus}).`);
    else if (res.length) lines.push(`Last generation: ${res.length} result(s), best score ${res[0].score ?? "n/a"}.`);
    return lines.join(" ");
  }
  let ctxTimer = null;
  function syncContext() {
    if (!connected) return;
    clearTimeout(ctxTimer);
    ctxTimer = setTimeout(() => {
      request("ui/update-model-context", {
        content: [{ type: "text", text: summary() }],
        structuredContent: { studio_id: studioId, studio: snapshot() },
      }).catch(() => {});
    }, 300);
  }

  // ---- the server's state ------------------------------------------------------

    best = best && typeof r.score === "number";  // a result made with its checks off is never "Best"
    const i = video ? images.findIndex(m => m.uri === r.source) : -1, n = i + 1;
    return el("article", { class: "res" + (best ? " best" : ""), ...(n ? linked(n) : {}) }, media(r, isVideo(r)),
      el("div", { class: "body" },
        el("div", { class: "row" }, scoreChip(r.score), best ? el("span", { class: "chip acc" }, "Best") : null,
          r.status === "rejected" ? el("span", { class: "chip warn" }, "Not publishable") : null,
          r.view === "back" ? el("span", { class: "chip" }, "Back") : null),
        n ? el("button", { class: "link", on: { click: () => showImage(n) } }, `From image ${n}`) : null,
        r.note ? el("div", { class: "hint" }, r.note) : null,
        safeUrl(r.url) ? el("div", { class: "row" },
          el("a", { href: safeUrl(r.url), target: "_blank", rel: "noopener", class: "btn" }, "Open"),
          // A spin's MP4: the video model's raw clip (not cut to the loop, not reversed).
          safeUrl(r.video_url) ? el("a", { href: safeUrl(r.video_url), target: "_blank", rel: "noopener",
            class: "btn", download: true }, "Download video") : null,
          // A Photo Try-On front view: its videos on Video Try-On.
          !video && r.view !== "back" && str(r.uri) ? el("button", { class: "btn", disabled: busy() || !ready(),
            on: { click: () => animate(r.uri) } }, "Animate") : null) : null));
  }
  function resultsSection() {
    const cap = S.capability;
    // The generation being followed shows its results so far; the studio's
    // results once the server recorded them.
    const live = L.live && L.live.cap === cap ? L.live : null;
    const v = cap === "video_tryon" ? videoView()
      : { images: [], videos: live ? live.results : S.results[cap], running: !!live && !!polling };
    const res = v.videos, best = cap === "video_tryon" ? ranked(v) : !v.running;
    const more = placeholders(live, "results", ratioOf(cap));
    const noun = { tryon: "image", video_tryon: "video", spin: "spin" }[cap];
    return [imagesSection(v, live), res.length || more.length ? section(v.running ? "Results so far" : "Results",
      String(res.length), failedNote(live, "results", noun),
      el("div", { class: "results" }, res.map((r, i) => resultCard(r, best && i === 0, cap !== "tryon", v.images)), more))
      : null];
  }

  function render() {
    const active = document.activeElement;
    const focused = active && active.dataset ? str(active.dataset.k) : "";
    const caret = focused ? [active.selectionStart, active.selectionEnd] : null;
    kept = keeping; keeping = new Map();
    const tabs = document.getElementById("tabs");
    tabs.replaceChildren(el("div", { class: "tabs", role: "tablist", "aria-label": "Capability" }, Object.entries(CAPS).map(([k, v]) =>
      el("button", { class: "tab" + (S.capability === k ? " on" : ""), role: "tab", "aria-selected": String(S.capability === k),
        on: { click: () => {
          if (S.capability === k) return;
          S.capability = k; render(); syncContext(); act({ capability: k });
        } } }, v))), queued ? el("span", { class: "status" }, "Saving…") : "");
    const page = [restoreMsg ? el("div", { class: "alert" }, restoreMsg) : null,
                  L.notice ? el("div", { class: "alert", role: "alert" }, L.notice) : null];
    // Video Try-On takes the Photo Try-On inputs: the video starts with that try-on.
    if (makesTryOn()) page.push(personSection(), productsSection());
    if (S.capability === "video_tryon") page.push(motionSection());
    if (makesTryOn()) page.push(moreSection());
    if (S.capability === "spin") page.push(spinSection());
    page.push(optionsSection(), generateSection(), ...resultsSection());
    document.getElementById("page").replaceChildren(...page.filter(Boolean));
    // The text being typed keeps its focus and caret.
    const again = focused && [...document.querySelectorAll("[data-k]")].find(n => n.dataset.k === focused);
    if (again) { again.focus(); try { again.setSelectionRange(caret[0], caret[1]); } catch (_) { /* not a text field */ } }
    reportHeight();
  }

  // ---- uploads ---------------------------------------------------------------
  const fileInput = document.getElementById("file");
  function pick(target) { uploadTarget = target; fileInput.multiple = target === "product" || target === "spin"; fileInput.click(); }
  // A file as a JPEG data URL at most `m` px wide and high, read without a blob: URL (the host's CSP blocks them).
  async function shrink(file, m, quality) {
    const img = await createImageBitmap(file).catch(() => { throw new Error("not an image"); });
    const s = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    img.close();
    return c.toDataURL("image/jpeg", quality);
  }
  // The original file goes straight into the bucket (a signed PUT URL); when that fails once (tools
  // not reloaded, no signing, the PUT blocked), every upload of the session is shrunk and sent as base64.
  let direct = true;
  async function send(f) {
    if (direct && f.size <= 20 * 1024 * 1024) {  // the server's limit (gcs.MAX_IMAGE_BYTES)
      try {
        const u = await tool("studio_upload_url", { studio_id: studioId, content_type: f.type });
        const r = await fetch(str(u.url), { method: "PUT", headers: isObj(u.headers) ? u.headers : {}, body: f });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await tool("studio_upload_saved", { studio_id: studioId, ref: str(u.ref), filename: f.name });
      } catch (e) { direct = false; console.warn("direct upload failed:", e); }
    }
    return tool("studio_upload", { image_base64: await shrink(f, 1600, 0.9), filename: f.name, studio_id: studioId });
  }
  // At most `n` calls of fn at a time: a call that ends hands its slot to the next one waiting.
  function limited(n, fn) {
    let active = 0;
    const waiting = [];
    return async (...a) => {
      if (active < n) active++; else await new Promise(r => waiting.push(r));
      try { return await fn(...a); } finally { const w = waiting.shift(); if (w) w(); else active--; }
    };
  }
  const sendSome = limited(4, send);
  // Each file shows at once where it will land (only the ones there is room for) until its upload ends.
  fileInput.addEventListener("change", async () => {
    const field = uploadTarget, list = S[listOf(field)];
    const room = Array.isArray(list) ? 8 - list.length - L.uploads.filter(u => u.field === field).length : 1;
    const files = Array.from(fileInput.files || []).slice(0, Math.max(0, room));
    fileInput.value = "";
    const ups = files.map(() => ({ key: randomHex(6), field, thumb: "" }));
    L.uploads.push(...ups);
    render();
    ups.forEach((u, i) => shrink(files[i], 88, 0.8).then(t => { u.thumb = t; render(); }, () => {}));
    // Up to 4 uploads at once; each file lands (its action is sent) in the order picked.
    const sent = files.map(f => sendSome(f));
    sent.forEach(p => p.catch(() => {}));  // a failure is reported in its turn below
    for (const [i, p] of sent.entries()) {
      try {
        const up = await p;
        const item = remember(cleanItem({ label: up.label, ref: up.ref, thumb: up.thumb }));
        if (!item) throw new Error(str(up.error) || "no image saved");
        const meta = { source: "upload", description: str(up.description) };
        if (field !== "product" && field !== "spin") change({ set: { field, item: lean(item) }, ...meta });
        else if ((field === "spin" ? S.spin : S.products).length < 8)
          change({ add: { field: field === "spin" ? "spin" : "product", item: lean(item), replace_index: -1 }, ...meta });
      } catch (e) { L.notice = `Upload failed: ${e.message}`; }
      L.uploads = L.uploads.filter(u => u !== ups[i]);
      render();
    }
  });

  // ---- generation ------------------------------------------------------------
  // A start spec. `tryon`: a Make video job, the uri of the video try-on image
  // whose videos are made again (the server takes its products and back view).
  function spec(cap, tryon) {
    const refs = (xs) => xs.map(x => x.ref);
    return { studio_id: studioId, capability: cap, person: S.person?.ref || "",
             reference_model: S.reference_model?.ref || "", products: refs(S.products), tryon_image: tryon || "",
             spin: refs(S.spin), settings: { ...S.settings.tryon, ...S.settings[cap] } };
  }
  function missing(cap) {
    if (cap === "spin") return S.spin.length ? "" : "Add product photos to spin first.";
    if (!S.person) return "Choose a person first.";
    if (!S.products.length) return "Add at least one product first.";
    return "";
  }
  function generate() {
    const cap = S.capability;
    if (busy()) return;
    L.jobError = missing(cap);
    if (L.jobError) { L.retry = null; return render(); }
    start(cap, spec(cap));
  }
  const makeVideo = (uri) => { if (ready()) start("video_tryon", spec("video_tryon", uri)); };
  // "Animate" a Photo Try-On result on Video Try-On: the server animates it
  // (or makes a 9:16 image first) as a full run of the page, not a Make video.
  function animate(uri) {
    if (busy() || !ready()) return;
    S.capability = "video_tryon"; render(); syncContext(); act({ capability: "video_tryon" });
    start("video_tryon", spec("video_tryon", uri), "");
  }
  // The failed generation again: its spec, or (one this panel only followed) the page's,
  // recomputing what the server's preprocessing cache kept for it (refresh_cache).
  function tryAgain() {
    const r = L.retry;
    if (r && ready()) start(r.cap, { ...(r.spec || spec(r.cap, r.tryon)), refresh_cache: true });
  }
  // `starting`: the page of the generation being started; nothing else starts meanwhile.
  let starting = null;
  async function start(cap, sp, tryon = sp.tryon_image) {
    if (busy()) return;
    starting = cap; L.jobError = ""; L.jobStatus = "starting…";
    L.retry = { cap, spec: sp, tryon: sp.tryon_image };
    render();
    let jobId = "";
    try {
      const started = await tool("studio_job_start", { spec: sp });
      if (started.error) throw new Error(String(started.error));
      if (typeof started.job_id !== "string" || !started.job_id) throw new Error("The generation did not start.");
      jobId = started.job_id;
    } catch (e) {  // unless the panel follows another generation meanwhile (e.g. the agent's)
      if (!polling) L.jobError = String(e.message);
    }
    starting = null;
    if (!jobId) return render();
    poll(jobId, cap, true, tryon);  // clears any earlier error
    act({ job_started: { job_id: jobId, capability: cap } });  // saved with the studio
  }
  const POLL_LIMIT_MS = 30 * 60 * 1000;  // stop following a generation after this
  const POLL_RETRY_MS = [4000, 8000, 16000, 30000, 30000];  // waits after a failed status poll
  let pollRun = 0;  // bumped to stop the running poll loop (teardown)
  let polling = null;  // id of the generation being followed
  const followed = new Set();  // generations already followed in this page load
  // Follow the studio's running generation, e.g. one the agent started or
  // found in a reopened studio (with its image, for a Make video).
  function follow() {
    if (S.job && !polling && !followed.has(S.job.id)) poll(S.job.id, S.job.capability, false, S.job.tryon);
  }
  // Follow a generation (`fresh`: just started here), showing each variation
  // as soon as it is judged. When it ends, the server records its results in
  // the studio (job_finished) and the panel shows that state. A failed status
  // poll is retried; when the panel stops following before the end, it
  // shows the server's state again (which may follow the job anew).
  // `tryon`: the image of a Make video job.
  async function poll(jobId, capability, fresh, tryon) {
    const cap = capOf(capability);
    if (typeof jobId !== "string" || !jobId || !cap || polling) return;
    polling = jobId; followed.add(jobId); L.jobStatus = "starting…"; L.jobError = "";
    L.live = { cap, results: [], images: [], tryon: tryon || "",
               expected: counts(), made: counts(), failed: counts() };
    if (!fresh) L.retry = { cap, spec: null, tryon: tryon || "" };
    render(); syncContext();
    const run = ++pollRun, startedAt = Date.now();
    let wait = fresh ? 4000 : 0, ended = false, failures = 0;
    try {
      while (true) {
        await new Promise(r => setTimeout(r, wait)); wait = 4000;
        if (run !== pollRun) return;  // the panel is closing: the saved studio keeps the job
        if (Date.now() - startedAt > POLL_LIMIT_MS) {
          L.jobError = "Stopped following the generation after 30 minutes.";
          break;
        }
        let st;
        try {
          st = await tool("studio_job_status", { job_id: jobId });
          failures = 0;
        } catch (e) {  // a timeout or a host hiccup: try again, later each time
          if (run !== pollRun) return;
          if (failures >= POLL_RETRY_MS.length) throw e;
          wait = POLL_RETRY_MS[failures++];
          L.jobStatus = "reconnecting…"; render();
          continue;
        }
        if (run !== pollRun) return;
        if (st.status === "unknown") { ended = true; break; }  // no longer kept
        L.jobStatus = [str(st.progress), `${Number(st.elapsed_s) || 0} s`].filter(Boolean).join(" · ");
        // Each variation shows as soon as it is judged; the final order is the judge's.
        L.live.results = resultsOf(st.results);
        L.live.images = imagesOf(st.images);  // a full video try-on's images so far
        L.live.expected = counts(st.expected); L.live.failed = counts(st.failed);
        L.live.made = { image_results: fronts(st.image_results), results: fronts(st.results) };
        if (typeof st.tryon_image === "string") L.live.tryon = st.tryon_image;  // a Make video job's image
        if (L.retry && !L.retry.spec) L.retry.tryon = L.live.tryon;
        if (st.status === "running") { render(); continue; }
        // done, or error (e.g. "interrupted: ..." when its server stopped)
        if (st.status !== "done") L.jobError = str(st.error) || `Generation ${str(st.status) || "failed"}`;
        ended = true;
        break;
      }
    } catch (e) { L.jobError = String(e.message); }
    polling = null;
    render(); syncContext();
    if (ended) {
      await act({ job_finished: { job_id: jobId } });  // its results, saved with the studio
      return;
    }
    followed.delete(jobId);  // not ended: follow it again if the server still does
    await refresh();
  }
  // The host is about to remove the panel: stop polling and pending updates.
  function teardown() { pollRun++; restoreRun++; clearTimeout(ctxTimer); }

  // ---- results of studio_agent ----------------------------------------------------
  // Each carries the studio it saved: shown when newer than the panel's. A
  // reopened conversation replays every earlier result into the panel; those
  // are not newer than the restored studio.
  // Ignored until the saved studio was read (restore shows the newest);
  // a result without a state (its save failed) shows the server's state. It waits
  // for the actions being saved: their answer may be newer.
  async function fromResult(sc) {
    if (!canWrite) return;
    await settled();
    if (isObj(sc) && !isObj(sc.state)) { refresh(); return; }
    if (!isObj(sc) || !adopt(sc.state, sc.updated_at, true)) syncContext();
  }
  // The saved studio (images, settings, results, a running generation): what a
  // reopened conversation shows. `kind`: "saved", "new" (the server has none)
  // or "failed" (it could not be read; never taken for a new studio).
  async function fetchSaved() {
    let saved;
    try { saved = await tool("studio_state", { studio_id: studioId }); } catch (_) { return { kind: "failed" }; }
    if (saved.saved === false) return { kind: "new" };
    return saved.saved === true ? { kind: "saved", saved } : { kind: "failed" };
  }
  // Restore the saved studio, then show `first` (the result that opened the
  // panel) if it is newer. Until the saved studio is read, nothing is written
  // (it would change a studio the panel does not show); a failed read is
  // retried, and after the last try the panel stays read-only.
  const RESTORE_RETRY_S = [2, 4, 8, 16];
  async function restore(first) {
    const run = ++restoreRun;
    canWrite = false; stateAt = 0;
    for (let i = 0; ; i++) {
      const got = await fetchSaved();
      if (run !== restoreRun) return;  // closing, or another studio
      if (got.kind !== "failed") {
        canWrite = true; restoreMsg = "";
        if (got.kind === "saved") adopt(got.saved.state, got.saved.updated_at); else render();
        fromResult(first);
        return;
      }
      const last = i >= RESTORE_RETRY_S.length;
      restoreMsg = last ? "Could not load the saved studio, so changes are off. Reopen the conversation to try again."
        : "Could not load the saved studio, retrying…";
      render();
      if (last) return;
      await new Promise(r => setTimeout(r, RESTORE_RETRY_S[i] * 1000));
      if (run !== restoreRun) return;
    }
  }

  // Requests from the host: teardown before the panel is removed, and ping.
  function answer(m) {
    if (m.method === "ui/resource-teardown") teardown();
    if (m.method === "ui/resource-teardown" || m.method === "ping") post({ jsonrpc: "2.0", id: m.id, result: {} });
    else post({ jsonrpc: "2.0", id: m.id, error: { code: -32601, message: "Method not found" } });
  }

  let restoredFor = null;  // studio id already restored in this page load
  window.addEventListener("message", (ev) => {
    if (ev.source !== window.parent || window.parent === window) return;  // only the host
    const m = ev.data;
    if (!isObj(m) || m.jsonrpc !== "2.0") return;
    const hasId = typeof m.id === "string" || typeof m.id === "number";
    if (hasId && m.method === undefined && pending.has(m.id)) {
      const e = pending.get(m.id); clearTimeout(e.t); pending.delete(m.id);
      return m.error ? e.reject(new Error(str(isObj(m.error) && m.error.message) || "error")) : e.resolve(m.result);
    }
    if (hasId && typeof m.method === "string") return answer(m);
    if (m.method === "ui/notifications/host-context-changed") {
      const ctx = isObj(m.params) ? m.params : {};
      if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
      if (Array.isArray(ctx.availableDisplayModes)) modes = ctx.availableDisplayModes;
      if (ctx.displayMode) showMode(ctx.displayMode);
    } else if (m.method === "ui/notifications/tool-result") {
      const sc = isObj(m.params) ? m.params.structuredContent : null;
      if (!isObj(sc)) return;
      if (sc.studio_id && typeof sc.studio_id === "string") studioId = sc.studio_id;  // the agent's conversation
      // First result after the panel (re)loads, e.g. a reopened conversation
      // replaying the call that opened it: restore the saved studio first.
      if (restoredFor !== studioId) {
        restoredFor = studioId;
        restore(sc);
        return;
      }
      fromResult(sc);
    }
  });

  // ---- display mode: the right-hand side panel when the host offers it ----
  let modes = ["inline", "fullscreen"], mode = "inline";
  function showMode(m) { mode = m || mode; }  // the host's own frame switches and closes it
  async function setMode(m) {
    try {
      const r = await request("ui/request-display-mode", { mode: m });
      showMode((r && r.mode) || m);
    } catch (_) { /* the host keeps its current mode */ }
  }

  // ---- start -----------------------------------------------------------------
  (async () => {
    render();
    if (typeof ResizeObserver !== "undefined") new ResizeObserver(reportHeight).observe(document.documentElement);
    if (window.parent === window) return;
    try {
      const init = await request("ui/initialize", {
        protocolVersion: "2026-01-26", appCapabilities: {},
        appInfo: { name: "GenMedia Studio", version: "1.2.0" },
      }, 10000);
      const hc = init?.hostContext || {};
      if (hc.theme) document.documentElement.dataset.theme = hc.theme;
      if (Array.isArray(hc.availableDisplayModes)) modes = hc.availableDisplayModes;
      showMode(hc.displayMode || "inline");
      connected = true;
      notify("ui/notifications/initialized", {});
      if (modes.includes("pip") && mode !== "pip") setMode("pip");  // open on the right
      const g = await tool("studio_gallery", {});
      G = { models: arr(g.models), spin: arr(g.spin) };
      for (const m of G.models) remember(m);
      render(); syncContext();
      findProducts("", "");  // the featured products
    } catch (e) {
      L.jobError = "Could not connect to Gemini Enterprise: " + e.message; render();
    }
  })();
})();
</script>
</body>
</html>

name: '📥 Recipe Proposal Intake'

# Assigns `recipe_proposals.assignees` to a new recipe proposal and applies
# `recipe_proposals.label`, both from .github/policy.yml.
#
# After routing to the repository owners, hands the proposal to
# `_ai-recipe-proposal-triage-core.yml` for an automated first-pass triage
# evaluation based on `.agents/skills/triage-recipe-proposal/SKILL.md`.

on:
  issues:
    types:
      - 'opened'
      - 'reopened'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'issue number to route'
        required: true
        type: 'number'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number || github.event.inputs.issue_number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions: {}

jobs:
  route:
    timeout-minutes: 5
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
    outputs:
      is_proposal: '${{ steps.check_proposal.outputs.is_proposal }}'
      issue_number: '${{ steps.check_proposal.outputs.issue_number }}'
      issue_title: '${{ steps.check_proposal.outputs.issue_title }}'
      issue_body: '${{ steps.check_proposal.outputs.issue_body }}'
      issue_author: '${{ steps.check_proposal.outputs.issue_author }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: 'astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7' # ratchet:astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'

      - name: 'Check if issue is requesting to add a recipe and resolve details'
        id: 'check_proposal'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_REPO: '${{ github.repository }}'
          ISSUE_NUMBER: '${{ github.event.issue.number || github.event.inputs.issue_number }}'
        run: |-
          set -euo pipefail

          if [[ -z "${ISSUE_NUMBER}" ]]; then
            echo "::error::No issue number resolved from event or dispatch."
            exit 1
          fi

          MAX_BODY_CHARS=4000
          ISSUE_DATA="$(gh issue view "${ISSUE_NUMBER}" --json number,title,body,author,labels)"
          TITLE="$(echo "${ISSUE_DATA}" | jq -r '.title // ""')"
          BODY="$(echo "${ISSUE_DATA}" | jq -r --argjson max "${MAX_BODY_CHARS}" '(.body // "")[0:$max]')"
          AUTHOR="$(echo "${ISSUE_DATA}" | jq -r '.author.login // ""')"
          LABELS="$(echo "${ISSUE_DATA}" | jq -c '[.labels[].name]')"

          IS_PROPOSAL="false"
          if [[ "${TITLE^^}" == *'[RECIPE PROPOSAL]'* ]]; then
            IS_PROPOSAL="true"
          else
            IS_PROPOSAL="$(uv run --no-project python3 .github/scripts/check_recipe_proposal.py \
              --title "${TITLE}" \
              --body "${BODY}" \
              --labels "${LABELS}" | jq -r '.is_proposal')"
          fi

          echo "is_proposal=${IS_PROPOSAL}" >> "${GITHUB_OUTPUT}"
          echo "issue_number=${ISSUE_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "issue_author=${AUTHOR}" >> "${GITHUB_OUTPUT}"

          DELIM="EOF_$(uuidgen)"
          { echo "issue_title<<${DELIM}"; echo "${TITLE}"; echo "${DELIM}"; } >> "${GITHUB_OUTPUT}"
          { echo "issue_body<<${DELIM}"; echo "${BODY}"; echo "${DELIM}"; } >> "${GITHUB_OUTPUT}"

          if [[ "${IS_PROPOSAL}" != "true" ]]; then
            echo "#${ISSUE_NUMBER} is not a recipe proposal — skipping routing."
            exit 0
          fi

      - name: 'Assign the reviewers and label the issue'
        if: |-
          ${{ steps.check_proposal.outputs.is_proposal == 'true' }}
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_REPO: '${{ github.repository }}'
          ISSUE_NUMBER: '${{ steps.check_proposal.outputs.issue_number }}'
        run: |-
          set -euo pipefail

          p() {
            uv run --no-project --with pyyaml python3 \
              .github/scripts/load_policy.py "$1"
          }

          mapfile -t ASSIGNEES < <(p recipe_proposals.assignees)
          LABEL="$(p recipe_proposals.label)"

          if [[ ${#ASSIGNEES[@]} -eq 0 || -z "${LABEL}" ]]; then
            echo "::error::recipe_proposals.assignees or .label is empty in .github/policy.yml."
            exit 1
          fi

          ARGS=()
          for assignee in "${ASSIGNEES[@]}"; do
            ARGS+=(--add-assignee "${assignee}")
          done

          gh issue edit "${ISSUE_NUMBER}" "${ARGS[@]}"

          if ! gh issue edit "${ISSUE_NUMBER}" --add-label "${LABEL}"; then
            echo "::warning::Could not apply '${LABEL}' to #${ISSUE_NUMBER}; check the label exists."
          fi

          ACTUAL="$(gh issue view "${ISSUE_NUMBER}" --json assignees --jq '[.assignees[].login] | join(" ")')"

          for assignee in "${ASSIGNEES[@]}"; do
            if [[ " ${ACTUAL,,} " != *" ${assignee,,} "* ]]; then
              echo "::error::GitHub did not assign ${assignee} (no write access, or the name in recipe_proposals.assignees is stale)."
              exit 1
            fi
          done
          echo "Assigned #${ISSUE_NUMBER} to ${ACTUAL}."

  triage:
    needs: 'route'
    if: |-
      ${{ needs.route.outputs.is_proposal == 'true' }}
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
    uses: './.github/workflows/_ai-recipe-proposal-triage-core.yml' # zizmor: ignore[self-repository]
    with:
      issue_number: '${{ needs.route.outputs.issue_number }}'
      issue_title: '${{ needs.route.outputs.issue_title }}'
      issue_body: '${{ needs.route.outputs.issue_body }}'
      issue_author: '${{ needs.route.outputs.issue_author }}'
      app_id: '${{ vars.APP_ID }}'
    secrets:
      APP_PRIVATE_KEY: '${{ secrets.APP_PRIVATE_KEY }}'

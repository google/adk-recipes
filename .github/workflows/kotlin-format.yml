name: 🟣 Kotlin Format PR Checks

# Runs ktlint over the Kotlin files changed in a PR, auto-corrects what it
# can, and posts diff-style suggestion comments via reviewdog. The Kotlin
# counterpart to python-format.yml, go-format.yml and java-format.yml.
#
# Style contract. ktlint's own `ktlint_official` code style is used, which
# is what it applies when no `.editorconfig` sets `ktlint_code_style`. The
# repo has no `.editorconfig` today, so — as in java-format.yml — the
# version pinned in `env` below IS the style contract, and bumping it is a
# style change. To move Kotlin style off ktlint's default (for example to
# `intellij_idea`, or to set `max_line_length`), add a root `.editorconfig`
# with a `[*.{kt,kts}]` section rather than passing flags here; ktlint
# discovers it by walking up from each target file, which is the same
# arrangement ruff has with `[tool.ruff]` in pyproject.toml and
# golangci-lint has with `.golangci.yml`.

on:
  pull_request:
    paths:
      - "core/**/*.kt"
      - "core/**/*.kts"
      - "contrib/**/*.kt"
      - "contrib/**/*.kts"
      - "skills/**/*.kt"
      - "skills/**/*.kts"
      # ktlint reads its style from .editorconfig, so a change to one is a
      # change to what this job enforces and should re-run it — the same
      # reason go-format.yml lists `.golangci.yml`. Note this only makes
      # the check RUN: the job still reports on changed Kotlin files alone,
      # so an .editorconfig-only PR goes green without re-checking the tree.
      # There is no .editorconfig in the repo today (see the header).
      - ".editorconfig"
      - ".github/workflows/kotlin-format.yml"
      # NOTE: `kotlin/agents/**` is deliberately absent, exactly as
      # `java/agents/**` is absent from java-format.yml and `go/agents/**`
      # from go-format.yml. Those are retired recipe roots
      # (.github/policy.yml `frozen_paths`) that PRs may not add to or
      # modify anyway, so formatting them would only produce findings the
      # author is not allowed to act on.
      #
      # This list alone is NOT sufficient to exclude them: `paths:` decides
      # whether the workflow RUNS, not which files the diff below returns.
      # The job therefore also scopes `git diff` to `-- core contrib
      # skills`. Keep the two in sync.
      #
      # Every Kotlin file in the repo today lives under kotlin/agents, so
      # this workflow is forward-looking: it goes green with nothing to do
      # until the first core/kotlin, contrib/kotlin or Kotlin
      # vertical-skill recipe lands. That mirrors java-format.yml and
      # go-format.yml, both of which shipped the same way.

# Declared per job rather than here. `pull-requests: write` at the workflow
# level is inherited by EVERY job, including any added later that only need
# to read — which is what zizmor's `excessive-permissions` audit flags. See
# the same note in go-format.yml and java-format.yml.
permissions: {}

# Cancel superseded runs on the same PR to save runner minutes and avoid
# stale suggestion comments from an older commit lingering on the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Pinned rather than `latest` so a ktlint release cannot turn every open
  # PR red without warning. Bump deliberately, and re-run the formatter
  # over existing Kotlin recipes when you do — a rule added or changed in a
  # new release will otherwise surface as suggestion noise on the next
  # unrelated PR.
  #
  # KTLINT_SHA256 is the checksum of the `ktlint` release asset for this
  # exact version and MUST be updated with it. It is the binary equivalent
  # of the ratchet SHA pins on the actions below: a release asset can be
  # re-uploaded under the same tag, and without this the job would silently
  # execute whatever it was handed. Get it from the release page, or:
  #   curl -sSfL <asset-url> | sha256sum
  KTLINT_VERSION: 1.8.0
  KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75

jobs:
  ktlint-format:
    name: Kotlin Format Suggestions
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout
      pull-requests: write # Post reviewdog suggestion comments
    # Formatting is syntactic — no Gradle, no dependency resolution, no
    # compilation — so the only real cost is JVM startup. 10 min is a
    # generous ceiling that still protects against a stuck reviewdog HTTP
    # call to the GitHub API. Matches the three sibling workflows.
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch complete history to locate the merge-base cleanly
          # Nothing here writes to the repo through git. The only git
          # operations are a read-only `git fetch origin <base>` and a
          # `git diff` on a public repository, and reviewdog authenticates
          # from REVIEWDOG_GITHUB_API_TOKEN in the step env rather than
          # git's credential store. Leaving the credential on disk would
          # serve no purpose while staying readable by any later step
          # (zizmor `artipacked`).
          persist-credentials: false

      - name: Install JDK
        # ktlint ships as a self-executing JAR — unlike google-java-format
        # it has no GraalVM native binary — so it needs a JVM. Installing
        # one explicitly rather than relying on whatever JDK the runner
        # image happens to preinstall, which changes without notice.
        #
        # 17 matches the minimum this repo documents for Kotlin recipes
        # (kotlin/README.md) and the `jvmToolchain(17)` the existing recipe
        # sets. ktlint itself only parses source with its embedded Kotlin
        # front-end, so the JDK version does not affect the formatting
        # result — this is about matching what a contributor has locally.
        #
        # Pinned to v5.7.0, not the current v6.0.0: v6 is an ESM rewrite
        # published 2026-08-24 that also swaps the Zulu Discovery API for
        # Azul Metadata and renames the `jdkFile` input. Let dependabot
        # propose that bump once it has soaked.
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # ratchet:actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install ktlint
        env:
          VERSION: ${{ env.KTLINT_VERSION }}
          EXPECTED_SHA256: ${{ env.KTLINT_SHA256 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.local/bin"
          BIN="$HOME/.local/bin/ktlint"

          curl -sSfL \
            "https://github.com/ktlint/ktlint/releases/download/${VERSION}/ktlint" \
            -o "$BIN"

          echo "${EXPECTED_SHA256}  ${BIN}" | sha256sum --check --strict -

          chmod +x "$BIN"
          "$BIN" --version

      - name: Install Reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # ratchet:reviewdog/action-setup@v1
        with:
          # Pinned rather than `latest` so a reviewdog release cannot turn
          # every open PR red without warning. Matches the pin in
          # python-format.yml, go-format.yml and java-format.yml.
          reviewdog_version: v0.21.0

      - name: Run ktlint & Suggest Changes
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the PR base ref through env instead of interpolating a
          # GitHub expression directly into the shell script (security
          # hardening — see the GitHub Actions security hardening guide).
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          # 1. Fetch the target branch reference commits.
          git fetch origin "$BASE_REF"

          # 2. Resolve the Kotlin files this PR modified.
          #
          #    Redirect to a file rather than `< <(git … | grep … || true)`.
          #    That idiom loses git's exit status twice over — `mapfile`
          #    never inspects a process substitution's status, and the
          #    `|| true` needed for grep's exit-1-on-no-match also swallows
          #    git's 128 — so a failed diff (no merge base, unreachable base
          #    tip) reads as "no Kotlin files changed" and reports a GREEN
          #    job having checked nothing. Here `set -e` sees the failure.
          #
          #    `-z` rather than a newline scan: git C-quotes any path with a
          #    non-ASCII byte, a quote, a backslash or a tab
          #    (core.quotePath), and the resulting trailing `"` makes such a
          #    file invisible to a suffix filter — silently never formatted,
          #    never reported. NUL-delimited output is never quoted.
          #
          #    `-- core contrib skills` is load-bearing: `on.paths` above
          #    controls only whether this workflow RUNS. A run triggered by
          #    an in-scope file would otherwise also collect any retired
          #    `kotlin/agents/**` file in the same PR and demand the author
          #    reformat a frozen path they are not allowed to touch.
          #
          #    `--diff-filter=d` drops deletions, so every path below still
          #    exists in the working tree. That matters: ktlint treats its
          #    arguments as patterns and exits 0 with only a "No files
          #    matched" warning when none resolve, which would be a false
          #    green.
          git diff -z --name-only --diff-filter=d "origin/$BASE_REF...HEAD" \
            -- core contrib skills > "$WORK/changed"

          ALL_CHANGED=()
          mapfile -d '' -t ALL_CHANGED < "$WORK/changed"

          # Both extensions: .kts covers Gradle build scripts
          # (build.gradle.kts, settings.gradle.kts), which every Kotlin
          # recipe ships and which ktlint formats with script-aware rules.
          CHANGED_FILES=()
          for f in "${ALL_CHANGED[@]}"; do
            case "$f" in
              *.kt|*.kts) CHANGED_FILES+=("$f") ;;
            esac
          done

          if [ ${#CHANGED_FILES[@]} -eq 0 ]; then
            echo "No Kotlin files were modified under core/, contrib/ or skills/. Skipping formatting."
            exit 0
          fi

          echo "Formatting Kotlin files: ${CHANGED_FILES[*]}"

          # 3. Auto-correct ONLY the modified Kotlin files, in place.
          #
          #    `--` so a path is never mistaken for an option, and
          #    `--log-level=warn` to drop ktlint's INFO chatter while
          #    keeping warnings — notably "No files matched", the one signal
          #    that the file list did not resolve.
          #
          #    The status is captured rather than left to `set -e`. ktlint
          #    exits 1 both for violations it cannot auto-correct (bad
          #    names, wildcard imports, a file that does not parse) and for
          #    its own usage errors, and aborting here would skip every
          #    reporting stage below: the contributor would get a red X with
          #    no formatting guidance at all — not even for the files that
          #    formatted cleanly. Record it, finish reporting, and account
          #    for it at the end. Same reasoning as java-format.yml's and
          #    go-format.yml's FMT_STATUS.
          FMT_STATUS=0
          ktlint --relative --log-level=warn --format --reporter=plain \
            -- "${CHANGED_FILES[@]}" > "$WORK/ktlint.out" || FMT_STATUS=$?

          # Violations ktlint could not fix, with PRE-format line numbers
          # (it reports positions from the pass that found them, before the
          # corrections of that pass are applied), so they line up with the
          # file as it appears in this PR.
          #
          # `--format` re-lints after each corrective pass, so an unfixable
          # violation is printed once per pass. Drop the trailing
          # "Summary error count" block, then dedupe while preserving order
          # — a plain `sort -u` would scramble the file order and make the
          # list harder to read than the duplicates it removes.
          sed '/^Summary error count/,$d' "$WORK/ktlint.out" \
            | awk 'NF && !seen[$0]++' > "$WORK/unfixable.txt"

          # A non-zero ktlint with nothing to report is ktlint FAILING TO
          # RUN — a bad JVM, an OOM, a usage error after a future flag
          # change — not a clean tree. It must never reach the PASS branch
          # below.
          if [ "$FMT_STATUS" -ne 0 ] && [ ! -s "$WORK/unfixable.txt" ]; then
            echo "::error::ktlint exited $FMT_STATUS without reporting any violation — it failed to run at all. This is a CI or configuration problem, not a formatting problem in your code. See the ktlint output above."
            exit "$FMT_STATUS"
          fi

          # 4. Decide the formatting result from the working tree, BEFORE
          #    involving reviewdog.
          #
          #    reviewdog cannot post review comments on a PR from a fork:
          #    the GITHUB_TOKEN is read-only there, the API answers "403
          #    Resource not accessible by integration", and reviewdog
          #    degrades to annotations. Letting its exit status decide the
          #    job would make the verdict depend on token scope. `git diff`
          #    knows definitively whether ktlint changed anything, so it is
          #    the authority here and reviewdog is a pure enhancement — a
          #    fork PR and a branch PR now fail identically.
          #
          #    --no-color is defensive: CI git doesn't colorize by default,
          #    but a self-hosted runner or a global git config could break
          #    the diff parser.
          git diff --no-color -- "${CHANGED_FILES[@]}" > "$WORK/fmt.diff"

          if [ ! -s "$WORK/fmt.diff" ] && [ "$FMT_STATUS" -eq 0 ]; then
            echo "[PASS] All modified Kotlin files are already formatted."
            exit 0
          fi

          # 5. Report the auto-correctable findings. The job log is the one
          #    surface that works on every PR, fork or not, so it comes
          #    first and is self-sufficient.
          if [ -s "$WORK/fmt.diff" ]; then
            # `-z` here for the same reason as step 2, and it matters as
            # much: a C-quoted path in the `::error file=` annotations below
            # matches no file GitHub knows about, so the annotation silently
            # fails to attach to the diff.
            git diff -z --name-only -- "${CHANGED_FILES[@]}" > "$WORK/unformatted"
            UNFORMATTED=()
            mapfile -d '' -t UNFORMATTED < "$WORK/unformatted"

            echo "::group::Reformatting diff (what ktlint would change)"
            cat "$WORK/fmt.diff"
            echo "::endgroup::"
            echo ""
            echo "[FAIL] ${#UNFORMATTED[@]} file(s) are not formatted:"
            printf '  - %s\n' "${UNFORMATTED[@]}"
            echo ""
            echo "Every change above is one ktlint applies for you. Download"
            echo "the ktlint binary from"
            echo "https://github.com/ktlint/ktlint/releases/tag/${KTLINT_VERSION}"
            echo "(or install it from your package manager, matching that"
            echo "version) and run:"
            echo ""
            echo "  ktlint --format ${UNFORMATTED[*]}"
            echo ""
            echo "Then commit the result."

            for f in "${UNFORMATTED[@]}"; do
              echo "::error file=$f::This file is not formatted. Run 'ktlint --format $f' and commit the result."
            done

            # Hand the same diff to reviewdog for inline suggestions.
            # Best-effort by construction: `-fail-level=none` because the
            # decision is made here, and `|| true` so a 403 on a fork PR
            # cannot turn a correct FAIL into an error about reviewdog.
            #
            # -fail-level rather than python-format.yml's -fail-on-error:
            # the latter is DEPRECATED as of reviewdog v0.21.0.
            reviewdog -f=diff \
                      -name="ktlint" \
                      -reporter=github-pr-review \
                      -filter-mode=added \
                      -fail-level=none < "$WORK/fmt.diff" || true
          fi

          # 6. Report what ktlint could NOT fix. These need a human edit, so
          #    they get their own section rather than being implied by the
          #    diff above — which does not contain them.
          if [ -s "$WORK/unfixable.txt" ]; then
            echo ""
            echo "::group::Violations ktlint cannot auto-correct"
            cat "$WORK/unfixable.txt"
            echo "::endgroup::"
            echo ""
            echo "[FAIL] The violations above are not auto-correctable —"
            echo "each names the rule that fired (see"
            echo "https://ktlint.github.io/ktlint/${KTLINT_VERSION}/rules/standard/)."
            echo "Fix them by hand and push again."
            echo ""
            echo "A 'Not a valid Kotlin file' entry is a syntax error rather"
            echo "than a style one: that file was skipped entirely, so the"
            echo "suggestions above do not cover it."

            # Positions are pre-format, so they address the file as this PR
            # has it. Greedy `.+` for the path is deliberate — line and
            # column are anchored as digits, so a path containing a colon
            # still splits correctly.
            while IFS= read -r line; do
              if [[ "$line" =~ ^(.+):([0-9]+):([0-9]+):\ (.*)$ ]]; then
                echo "::error file=${BASH_REMATCH[1]},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
              fi
            done < "$WORK/unfixable.txt"
          fi

          exit 1

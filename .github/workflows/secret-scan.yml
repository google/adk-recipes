name: Secret Scan

# Scans pull requests for accidentally committed secrets (API keys, tokens,
# private keys, credentials) using Gitleaks.
#
# Why this exists
# ---------------
# Recipes demonstrate realistic integrations with GCP services and third-party
# APIs. Contributors frequently test against live project credentials and risk
# accidentally committing sensitive keys or service account credentials.
# Running secret scanning on PRs ensures credentials are caught before merging
# to main.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-secrets:
    name: Scan PR commits for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GITLEAKS_VERSION: "v8.30.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --max-time 60 -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar -xz -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Scan PR commits for secrets with Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            gitleaks git --log-opts="origin/$BASE_REF...HEAD" --verbose --redact
          else
            gitleaks dir --verbose --redact .
          fi

name: Secret Scan

# Scans pull requests for accidentally committed secrets (API keys, tokens,
# private keys, credentials) using Gitleaks.
#
# Why this exists
# ---------------
# Recipes demonstrate realistic integrations with GCP services and third-party
# APIs. Contributors frequently test against live project credentials and risk
# accidentally committing sensitive keys or service account credentials.
# Running secret scanning on PRs ensures credentials are caught before merging
# to main.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-secrets:
    name: Scan PR commits for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commits for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # ratchet:gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Global Checks

# Generic and global pull request checks.
# Repository-wide constraints that apply across all contributions, beginning
# with permission validation on the .github/ directory.
#
# This job is a GUARD RAIL, NOT ENFORCEMENT. It is triggered by
# `pull_request`, so GitHub runs the PR's own copy of this file: a pull
# request that edits .github/ can edit or delete this check in the same
# commit. It catches the accident and hands the contributor an actionable
# message; it does not stop anyone determined. What actually enforces the
# rule is repository settings, not files in the tree:
#   * a CODEOWNERS entry for /.github/ with required review;
#   * a repository or organization ruleset restricting those paths;
#   * this job marked as a REQUIRED status check, so deleting it blocks the
#     merge (a required check that never reports is not a pass) rather than
#     silently skipping the gate.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-github-dir-permissions:
    name: Check .github/ directory permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Check permissions for .github/ changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "[INFO] Not a pull request (event: $EVENT_NAME); skipping .github/ permission check."
            exit 0
          fi

          git fetch origin "$BASE_REF"

          # --no-renames: with rename detection on, moving a file OUT of
          #   .github/ reports only the destination path, so the deletion
          #   from .github/ never reaches the checker.
          # core.quotePath=false: git C-quotes any path with non-ASCII bytes
          #   (".github/w\303\266rk.yml"), and the leading quote stops it
          #   matching the .github/ prefix.
          CHANGED_FILES=$(git -c core.quotePath=false diff \
            --no-renames --name-only "origin/$BASE_REF"...HEAD)

          # --no-project: this checker is stdlib-only, so there is nothing to
          # sync. Resolving the root project here would let an unrelated
          # pyproject.toml/uv.lock change in the PR fail a security check.
          echo "$CHANGED_FILES" | uv run --no-project python \
            tools/check_github_dir_changes.py \
            --author "$PR_AUTHOR" \
            --author-association "$AUTHOR_ASSOCIATION" \
            --repo "$REPO"

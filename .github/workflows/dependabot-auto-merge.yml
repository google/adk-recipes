name: 📦⚡ Dependabot Auto-Merge

# Auto-merges Dependabot PRs once required checks succeed. Watches PR
# events plus completions of the `checks` workflow and gates on
# all-checks-green before enabling merge.

# `workflow_run` is inherently dangerous — it runs in the context of the
# target repository with write scopes, and zizmor flags it as High. It is
# also load-bearing here and has no replacement: the whole point of this
# workflow is to react to CI *completing* on a PR, and `workflow_run` is
# the only trigger that fires then. zizmor's suggested alternative
# (`workflow_call`) would require the upstream workflows to invoke this one
# as a reusable workflow, which is a redesign of every gate listed below.
#
# What makes it tolerable here is that the job it guards never touches
# PR-controlled code. It does not check the PR out at all: every decision is
# made from `gh` API output, and every privileged action is a `gh pr` call.
# There is no build, no test run, no script from the PR.
#
# Reassess if a step is ever added that checks the PR out or runs anything
# from it.
#
# The directive has to sit ON this line, not above it: zizmor only honours
# an ignore comment that falls inside the span the finding covers, and this
# finding spans the whole `on:` block.
on: # zizmor: ignore[dangerous-triggers]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # Trigger when CI completes so auto-merge can evaluate and land the PR.
  # Lists every workflow whose completion should prompt a merge evaluation.
  # "🐍 Python Tests" is the longest-running gate and fires last on most PRs.
  # Add / remove names here if required checks change.
  workflow_run:
    workflows:
      - "🐍 Python Tests"
      - "Validate Python Recipe"
      - "Validate Recipe Structure"
      - "🐍 Python Format PR Checks"
      - "Python Dependency Policy"
      # Go. Fires on no Dependabot PR today. There is one go.mod in the tree
      # (go/agents/financial-advisor), but .github/dependabot.yml gives
      # `gomod` a suppression entry — no version updates and no security
      # updates — so Dependabot opens nothing for it to react to. Listed in
      # advance because lifting that suppression and forgetting this line
      # would leave those PRs never re-evaluated for auto-merge, a silent
      # failure rather than a loud one.
      - "🐹 Go Format PR Checks"
    types:
      - completed

# Declared per job below, not here. At the workflow level these are
# inherited by every job: `auto-approve` would receive `contents: write`
# (the scope that can push to the repo) purely because `auto-merge` needs
# it to squash-merge, even though approving a PR needs nothing of the sort.
# zizmor's `excessive-permissions` audit flags exactly that.
permissions: {}

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      # `gh pr review --approve` only. No checkout, no merge — so no
      # `contents:` scope at all, and notably not `contents: write`.
      pull-requests: write
    # `github.event.pull_request.user.login`, NOT `github.actor`.
    # github.actor is the LAST actor to touch the triggering context, not
    # the one that created the PR, so an attacker can open a PR whose HEAD
    # commit makes github.actor read as dependabot[bot] while the rest of
    # the branch is attacker-controlled — bypassing the check and earning a
    # free approval. The pull_request.user is the PR's author and cannot be
    # spoofed this way. (zizmor `bot-conditions`, a mandatory check.)
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event_name == 'pull_request'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # ratchet:dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh pr merge --squash`
      pull-requests: write # `gh pr comment` (rebase nudge) and `gh pr merge`
      checks: read # `gh api .../commits/<sha>/check-runs`
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Get PR number from workflow run
        id: pr
        run: |
          PR_NUMBER=$(gh pr list \
            --repo ${{ github.repository }} \
            --head ${GITHUB_EVENT_WORKFLOW_RUN_HEAD_BRANCH} \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR found for branch ${GITHUB_EVENT_WORKFLOW_RUN_HEAD_BRANCH}"
            exit 0
          fi

          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Found PR #$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}

      - name: Check if PR is from Dependabot
        if: steps.pr.outputs.number != ''
        id: check
        run: |
          PR_INFO=$(gh pr view ${STEPS_PR_OUTPUTS_NUMBER} \
            --repo ${{ github.repository }} \
            --json author,mergeable,state)

          PR_AUTHOR=$(echo "$PR_INFO" | jq -r '.author.login')
          PR_MERGEABLE=$(echo "$PR_INFO" | jq -r '.mergeable')
          PR_STATE=$(echo "$PR_INFO" | jq -r '.state')

          echo "PR Author: $PR_AUTHOR"
          echo "PR Mergeable: $PR_MERGEABLE"
          echo "PR State: $PR_STATE"

          if [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "app/dependabot" ]; then
            echo "is_dependabot=true" >> $GITHUB_OUTPUT
          else
            echo "is_dependabot=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "mergeable=$PR_MERGEABLE" >> $GITHUB_OUTPUT
          echo "state=$PR_STATE" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PR_OUTPUTS_NUMBER: ${{ steps.pr.outputs.number }}

      # Deliberately no checkout: this job is privileged, so a checkout of
      # refs/pull/<n>/head is CodeQL's `actions/untrusted-checkout/high`.
      # Both reads below come from the API instead. Keep it that way.
      - name: Check if changes are in agents using starter pack for testing
        if: steps.check.outputs.is_dependabot == 'true'
        id: check-agent
        run: |
          # Pins the reads below to one revision, so a push landing mid-run
          # cannot have the decision made against two different trees.
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${STEPS_PR_OUTPUTS_NUMBER}" --jq '.head.sha')

          # Get all changed files. --paginate: the default 30 per page would
          # silently drop recipes from a wide bump.
          CHANGED_FILES=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${STEPS_PR_OUTPUTS_NUMBER}/files?per_page=100" \
            --jq '.[].filename')

          # Only auto-merge when every changed recipe has automated tests.
          # (This comment used to say python/agents/**, which policy.yml
          # lists under frozen_paths and the grep below has never matched.)
          HAS_AUTOMATED_TESTS=true

          # Get all changed recipe directories across all supported locations:
          #   core/<language>/<recipe>       contrib/<language>/<recipe>
          #   skills/<vertical>/<solution>
          # Note the middle segment differs: a LANGUAGE under core/ and
          # contrib/, a VERTICAL under skills/. The pattern captures exactly
          # 3 path segments either way, so sub-directories (e.g.
          # core/python/deep-search/frontend) map back to the recipe root.
          CHANGED_AGENT_DIRS=$(echo "$CHANGED_FILES" \
            | grep -oE '(core|contrib|skills)/[^/]+/[^/]+' \
            | sort -u || true)

          if [ -z "$CHANGED_AGENT_DIRS" ]; then
            echo "No changes in core/|contrib/|skills/ recipe directories"
            HAS_AUTOMATED_TESTS=false
          else
            for dir in $CHANGED_AGENT_DIRS; do
              # Python recipes: require [tool.agent-starter-pack] as the signal
              # that the recipe has automated tests wired up.
              if [[ "$dir" == *"/python/"* ]]; then
                # A 404 here is the "no pyproject.toml" case.
                if ! PYPROJECT=$(gh api \
                  "repos/${{ github.repository }}/contents/${dir}/pyproject.toml?ref=${HEAD_SHA}" \
                  -H 'Accept: application/vnd.github.raw' 2>/dev/null); then
                  echo "$dir does not have pyproject.toml"
                  HAS_AUTOMATED_TESTS=false
                  break
                fi
                if ! grep -q '\[tool\.agent-starter-pack\]' <<< "$PYPROJECT"; then
                  echo "$dir is not using agent starter pack for testing"
                  HAS_AUTOMATED_TESTS=false
                  break
                fi
              else
                # Non-Python recipes (Go, Java, Kotlin, TypeScript): no
                # language-specific marker — trust CI checks to gate quality.
                echo "$dir is a non-Python recipe; trusting CI checks."
              fi
            done
          fi

          echo "has_tests=$HAS_AUTOMATED_TESTS" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PR_OUTPUTS_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Update branch if needed
        if: steps.check.outputs.is_dependabot == 'true' && steps.check-agent.outputs.has_tests == 'true' && steps.check.outputs.mergeable == 'CONFLICTING'
        run: |
          echo "Branch needs update, updating..."
          gh pr comment ${STEPS_PR_OUTPUTS_NUMBER} --body "@dependabot rebase"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PR_OUTPUTS_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Wait for all checks to complete
        if: steps.check.outputs.is_dependabot == 'true' && steps.check-agent.outputs.has_tests == 'true' && steps.check.outputs.mergeable != 'CONFLICTING'
        id: wait-checks
        run: |
          MAX_WAIT_TIME=600  # 10 minutes
          WAIT_INTERVAL=30   # 30 seconds
          elapsed=0

          echo "Waiting for all checks to complete..."

          while [ $elapsed -lt $MAX_WAIT_TIME ]; do
            # Get PR details via API
            PR_DATA=$(gh api repos/${{ github.repository }}/pulls/${STEPS_PR_OUTPUTS_NUMBER})

            # Get commit SHA
            HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')

            # Get check runs for this commit.
            #
            # --paginate is load-bearing, not tidiness. The unpaginated call
            # returns .total_count for the whole commit but only the first 30
            # check runs in .check_runs[]. This repo routinely exceeds 30
            # checks on a single PR, so PENDING and FAILED were counted over a
            # truncated slice while TOTAL was not: a PR whose 31st check was
            # queued or failing read as "all checks completed successfully"
            # and was merged on incomplete or red CI.
            #
            # --slurp wraps the pages in an array, hence the [.[].check_runs[]]
            # flatten below. TOTAL is now the length of what we actually
            # counted rather than a server-side figure the other two counts
            # cannot see all of.
            CHECK_RUNS=$(gh api --paginate --slurp \
              "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100")

            # Count checks
            TOTAL=$(echo "$CHECK_RUNS" | jq '[.[].check_runs[]] | length')
            PENDING=$(echo "$CHECK_RUNS" | jq '[.[].check_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
            FAILED=$(echo "$CHECK_RUNS" | jq '[.[].check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length')

            echo "Total checks: $TOTAL, Pending: $PENDING, Failed: $FAILED"

            if [ "$FAILED" -gt 0 ]; then
              echo "Some checks failed, will not merge"
              echo "all_passed=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ "$PENDING" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "All checks completed successfully"
              echo "all_passed=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ "$TOTAL" -eq 0 ]; then
              echo "No checks found yet, waiting..."
            fi

            echo "Waiting $WAIT_INTERVAL seconds before next check..."
            sleep $WAIT_INTERVAL
            elapsed=$((elapsed + WAIT_INTERVAL))
          done

          echo "Timeout waiting for checks to complete"
          echo "all_passed=false" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PR_OUTPUTS_NUMBER: ${{ steps.pr.outputs.number }}

      # ---------------------------------------------------------------------------
      # Branch protection decides whether the merge can happen at all, and it
      # is not something green CI implies. `main` sets
      # require_code_owner_reviews, and the approval this workflow posts comes
      # from github-actions[bot], which owns no path in CODEOWNERS — so the
      # review requirement is never satisfied by anything this workflow does.
      #
      # Without this gate the previous step's "All checks completed
      # successfully" was followed one second later by `gh pr merge` failing
      # with "base branch policy prohibits the merge", a non-zero exit, and a
      # red run. That accounted for roughly 86% of this workflow's failures
      # (~457 of 532) over the 90 days to 2026-09-16, while merging nothing
      # since 2026-06-29.
      #
      # Reading reviewDecision and mergeStateStatus turns that into an honest,
      # green, explanatory no-op. It does NOT restore auto-merge: that needs an
      # approval identity which is a code owner, which is a repo-admin decision
      # and not something a workflow can grant itself.
      # ---------------------------------------------------------------------------
      - name: Check merge eligibility
        if: |
          steps.check.outputs.is_dependabot == 'true' &&
          steps.check-agent.outputs.has_tests == 'true' &&
          steps.wait-checks.outputs.all_passed == 'true' &&
          steps.check.outputs.mergeable != 'CONFLICTING'
        id: eligible
        run: |
          set -uo pipefail

          # Deliberately not `set -e`. This step exists to stop a predictable
          # merge refusal from producing a red run, so it must not become a
          # new way to go red. Anything it cannot determine is treated as
          # "do not merge", which is the safe direction.
          # stderr goes to a file, never into PR_VIEW: gh can emit warnings on
          # an otherwise successful call, and folding those into the captured
          # stdout would hand malformed JSON to jq below.
          ERR_FILE="$(mktemp)"
          PR_VIEW=""
          for attempt in 1 2 3; do
            if PR_VIEW=$(gh pr view "${STEPS_PR_OUTPUTS_NUMBER}" \
              --repo "${{ github.repository }}" \
              --json reviewDecision,mergeStateStatus 2>"$ERR_FILE"); then
              break
            fi
            echo "attempt ${attempt}: could not read PR state: $(cat "$ERR_FILE")"
            PR_VIEW=""
            sleep $((attempt * 5))
          done

          if [ -z "$PR_VIEW" ]; then
            echo "::warning::could not determine merge eligibility after 3 attempts; not merging"
            echo "can_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REVIEW_DECISION=$(echo "$PR_VIEW" | jq -r '.reviewDecision // ""')
          MERGE_STATE=$(echo "$PR_VIEW" | jq -r '.mergeStateStatus // ""')

          echo "reviewDecision=$REVIEW_DECISION mergeStateStatus=$MERGE_STATE"

          # UNKNOWN means GitHub has not finished computing mergeability —
          # it is derived asynchronously after a push. Merging on UNKNOWN is
          # the race this gate exists to avoid, so decline and let a later
          # run pick it up once the state has settled.
          if [ "$MERGE_STATE" = "UNKNOWN" ] || [ -z "$MERGE_STATE" ]; then
            echo "::notice::merge state not yet computed; not merging this run"
            echo "can_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # BLOCKED covers the code-owner case and any other unmet protection
          # rule. REVIEW_REQUIRED is the same story stated from the review side.
          if [ "$MERGE_STATE" = "BLOCKED" ] || [ "$REVIEW_DECISION" = "REVIEW_REQUIRED" ]; then
            echo "can_merge=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Auto-merge declined"
              echo ""
              echo "PR #${STEPS_PR_OUTPUTS_NUMBER} has green CI but branch protection will not accept the merge."
              echo ""
              echo "- \`reviewDecision\`: \`${REVIEW_DECISION:-none}\`"
              echo "- \`mergeStateStatus\`: \`${MERGE_STATE:-unknown}\`"
              echo ""
              echo "\`main\` requires a review from a code owner. The approval this workflow"
              echo "posts is authored by \`github-actions[bot]\`, which owns no path in"
              echo "CODEOWNERS, so the requirement cannot be met from here. A human code"
              echo "owner needs to approve and merge, or a repo admin needs to give the"
              echo "automation a code-owner identity."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "can_merge=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PR_OUTPUTS_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Merge PR
        if: |
          steps.check.outputs.is_dependabot == 'true' &&
          steps.check-agent.outputs.has_tests == 'true' &&
          steps.wait-checks.outputs.all_passed == 'true' &&
          steps.check.outputs.mergeable != 'CONFLICTING' &&
          steps.eligible.outputs.can_merge == 'true'
        run: |
          echo "All checks passed, merging PR #${STEPS_PR_OUTPUTS_NUMBER}"
          gh pr merge ${STEPS_PR_OUTPUTS_NUMBER} --repo ${{ github.repository }} --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PR_OUTPUTS_NUMBER: ${{ steps.pr.outputs.number }}